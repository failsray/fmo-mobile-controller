name: FMO-X
options:
  bundleIdPrefix: com.x
  deploymentTarget:
    macOS: "10.15"
  createIntermediateGroups: true
  groupSortPosition: top
targets:
  FMO-X:
    type: application
    platform: macOS
    deploymentTarget: "10.15"
    sources:
      - path: App
        excludes:
          - "**/Info.plist"
          - "**/*.b64"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FMO-X
        CFBundleShortVersionString: "1.6.6"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "10.15.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x.fmocontroller
        PRODUCT_NAME: FMO-X
        MARKETING_VERSION: 1.6.6
        CURRENT_PROJECT_VERSION: 1
        MACOSX_DEPLOYMENT_TARGET: "10.15"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Intel only: the target machine runs macOS 10.15 Catalina.
        # An Intel build also runs on Apple Silicon via Rosetta 2.
        ARCHS: "x86_64"
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
