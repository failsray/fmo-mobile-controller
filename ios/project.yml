name: FMO-X
options:
  bundleIdPrefix: com.x
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
targets:
  FMO-X:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "**/Info.plist"
          - "**/*.b64"
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x.fmocontroller
        PRODUCT_NAME: FMO-X
        MARKETING_VERSION: 1.6.6
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
