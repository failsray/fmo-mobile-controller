<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FMO Mobile Controller</title>
    <style>
        :root {
            /* 默认使用 Orange Theme (参考截图) */
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-cyan: #ff9800;   /* 主橙色 */
            --accent-magenta: #ffb74d; /* 辅助橙色/高亮 */
            --accent-green: #4caf50;
            --border-color: #333333;
            --viz-bg: #1a1a1a;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        /* 主题定义 - 保留其他作为可选项 */
        body.theme-cyberpunk {
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff00ff;
            --accent-green: #00ff66;
            --border-color: rgba(255, 255, 255, 0.15);
            --viz-bg: radial-gradient(circle at center, #111 0%, #000 100%);
        }


        /* 主题定义 */
        body.theme-matrix {
            --bg-color: #000000;
            --panel-bg: rgba(0, 20, 0, 0.9);
            --text-main: #00ff00;
            --text-muted: #008800;
            --accent-cyan: #00ff00; /* 主色调 */
            --accent-magenta: #008f11; /* 辅色调 */
            --accent-green: #00ff00;
            --border-color: rgba(0, 255, 0, 0.2);
            --viz-bg: #000;
        }

        body.theme-ocean {
            --bg-color: #001f3f;
            --panel-bg: rgba(0, 31, 63, 0.85);
            --text-main: #b3e5fc;
            --text-muted: #568ea3;
            --accent-cyan: #7FDBFF;
            --accent-magenta: #0074D9;
            --accent-green: #39CCCC;
            --border-color: rgba(127, 219, 255, 0.2);
            --viz-bg: linear-gradient(to bottom, #001f3f, #001020);
        }

        body.theme-sunset {
            --bg-color: #2d1b2e;
            --panel-bg: rgba(45, 27, 46, 0.85);
            --text-main: #ffd1dc;
            --text-muted: #b07289;
            --accent-cyan: #ff9e64;
            --accent-magenta: #ff0055;
            --accent-green: #ffca28;
            --border-color: rgba(255, 158, 100, 0.2);
            --viz-bg: linear-gradient(to bottom, #2d1b2e, #1a0f1a);
        }

        body.theme-light {
            --bg-color: #f0f2f5;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --text-main: #333333;
            --text-muted: #666666;
            --accent-cyan: #2196F3;
            --accent-magenta: #673AB7;
            --accent-green: #4CAF50;
            --border-color: rgba(0, 0, 0, 0.1);
            --viz-bg: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #121212; /* 默认深色背景，防止白边 */
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            width: 100%;
            display: grid;
            grid-template-rows: auto auto 1fr auto; /* Header, Settings, Viz, Controls */
            grid-template-areas: 
                "header"
                "settings"
                "viz"
                "controls";
            overflow: hidden;
            transition: background-color 0.5s, color 0.5s;
            overscroll-behavior: none; /* 禁用弹性滚动导致的白边 */
            /* 全面屏安全区避让：顶部避开状态栏/刘海，底部避开手势条（需壳层全面屏 + viewport-fit=cover 才生效） */
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        /* 顶部状态栏 */
        header {
            grid-area: header;
            padding: 10px 6px; /* 进一步压缩左右内边距 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            transition: background 0.5s, border-color 0.5s;
            margin: 8px 10px 0 10px; /* 恢复为 10px 以匹配其他框 */
            border-radius: var(--radius-md);
            overflow: hidden; /* 确保内容不溢出 */
            border: 1px solid var(--border-color); /* 显式添加边框以匹配其他框 */
        }

        .brand {
            font-size: 1.1rem; /* 增加字体大小，使其高度与图标接近 */
            font-weight: bold;
            letter-spacing: 0px; /* 压缩字母间距 */
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 1;
            min-width: 0;
            margin-right: -10px; /* 负边距压缩 controller 后面的空间 */
        }
        .brand span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand::before {
            content: 'F';
            background: var(--accent-cyan);
            color: #000;
            width: 22px; /* 减小图标 */
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px; /* 进一步减小间距 */
            flex-shrink: 0;
        }

        .qso-count-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0 8px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .theme-btn:active, .qso-count-badge:active { 
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }
        .theme-btn:hover, .qso-count-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        .status-indicators {
            display: flex;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            transition: all 0.3s ease;
        }
        .status-dot.connected { background-color: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }
        .status-dot.error { background-color: #ff3333; box-shadow: 0 0 5px #ff3333; }

        /* 主可视区域 */
        .viz-container {
            grid-area: viz;
            position: relative;
            background: var(--viz-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer; /* 提示可点击 */
            min-height: 0; /* 防止 grid item 溢出 */
            margin: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .viz-info-container {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            pointer-events: none;
            z-index: 10;
            align-items: center;
        }

        #current-station-text {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 10;
            /* Override any defaults if needed, but viz-mode-badge class handles most */
        }

        .viz-mode-badge {
            /* position: absolute; Removed for flex container */
            padding: 4px 10px;
            background: var(--accent-cyan);
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            font-size: 0.75rem;
            /* pointer-events: none; Handled by container */
            opacity: 1;
            white-space: nowrap;
        }

        /* 控制面板区域 */
        .controls-area {
            grid-area: controls;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: auto;
            max-height: 50vh; /* 限制最大高度，给波形留空间 */
            overflow-y: auto;
            transition: background 0.5s, border-color 0.5s;
            margin: 0 10px 10px 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        /* 播放控制 */
        /* .player-controls 移除，直接使用 control-btn-group 和 vol-bar-container 垂直排列 */

        .control-btn-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between; /* 在小屏上分散对齐，或 center */
            width: 100%;
        }

        /* 统一大按钮样式 - 调整为矩形 */
        .btn-rect-lg {
            height: 48px; /* 加高 */
            flex: 1; /* 均匀分布 */
            min-width: 0;
            padding: 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--accent-magenta);
            background: rgba(255, 152, 0, 0.1);
            color: var(--accent-cyan);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: none;
        }
        
        /* 播放按钮突出显示 */
        #btn-play {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            flex: 2; /* 更宽 */
        }
        #btn-play:active { transform: scale(0.98); opacity: 0.9; }

        /* 录音按钮 */
        .btn-record {
            border-color: #d32f2f;
            color: #d32f2f;
            background: rgba(211, 47, 47, 0.1);
        }
        .btn-record.recording {
            background: #d32f2f;
            color: #fff;
            box-shadow: 0 0 10px #d32f2f;
            animation: none;
        }

        /* 顶部设置区域 */
        #settings-area {
            grid-area: settings;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
            max-height: 0; /* Use max-height for transition */
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            z-index: 99;
            margin: 0 10px;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            margin-top: -10px; /* 连接 Header */
            border-top: none;
        }
        #settings-area.open {
            max-height: 300px; /* Enough space for content */
            padding: 20px;
            margin-bottom: 10px;
        }
        
        /* 历史设备列表样式 */
        .device-history {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        #settings-area.open .device-history {
            opacity: 1;
            transform: translateY(0);
        }

        .device-tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .device-tag:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }
        .device-tag.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(0, 243, 255, 0.1);
        }
        .device-del {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            font-size: 10px;
            line-height: 1;
            color: #aaa;
        }
        .device-del:hover {
            background: #ff3333;
            color: white;
        }
        .btn-rect-lg:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .btn-rect-lg.active { background: var(--accent-magenta); color: var(--bg-color); box-shadow: 0 0 15px var(--accent-magenta); }

        /* 录音按钮特殊样式覆盖 */
        .btn-record {
            border-color: #ff3333;
            color: #ff3333;
        }
        .btn-record.recording {
            background: rgba(255, 51, 51, 0.2);
            box-shadow: 0 0 15px #ff3333;
            animation: pulse 1.5s infinite;
        }
        .btn-record .icon {
            width: 14px;
            height: 14px;
            background-color: currentColor;
            border-radius: 2px; /* 矩形内也是矩形 */
            transition: all 0.2s;
        }
        .btn-record.recording .icon {
            border-radius: 2px;
            transform: scale(0.8);
        }

        /* 音量条容器 */
        .vol-bar-container {
            display: flex;
            align-items: center;
            width: 100%;
            height: 48px;
            padding: 0 15px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .vol-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            margin-right: 15px;
            cursor: pointer;
        }
        
        .vol-track-wrapper {
            flex: 1;
            height: 48px; /* 增大触摸热区 */
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .vol-track {
            width: 100%;
            height: 6px; /* 加粗 */
            background: #333;
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }

        .vol-fill {
            height: 100%;
            background: var(--accent-cyan);
            border-radius: 3px;
            width: 50%; /* 默认值 */
            position: relative;
            box-shadow: none;
            transition: width 0.1s linear;
        }

        /* 滑块头部圆点 */
        .vol-thumb {
            width: 18px;
            height: 18px;
            background: var(--accent-cyan);
            border-radius: 50%;
            position: absolute;
            right: -9px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            border: 2px solid #fff;
        }
        
        .vol-track-wrapper:active .vol-thumb {
            transform: translateY(-50%) scale(1.1);
        }

        .vol-value-text {
            width: 45px;
            text-align: right;
            font-size: 14px;
            color: var(--text-muted);
            font-family: monospace;
            margin-left: 15px;
        }

        /* 台站列表 */
        .station-panel {
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-md);
            padding: 15px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex: 1; /* 填充剩余空间 */
            min-height: 150px; /* 保证最小高度 */
            overflow: hidden;
            margin: 0 0px 0px 0px; /* 与 Controls 对齐 */
        }
        
        .station-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .station-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden; /* 防止横向滚动 */
            padding-right: 2px; /* 给滚动条留点位置 */
            padding-bottom: 50px; /* 底部留白给按钮 */
            position: relative;
        }




        .station-item {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .station-item.active {
            background: rgba(0, 243, 255, 0.1);
            border-left-color: var(--accent-cyan);
        }
        .station-item:active { background: rgba(255,255,255,0.1); }
        
        .st-name { 
            font-weight: 500;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 设置面板 */
        .settings-panel {
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-dark {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
        }
        .btn-small {
            padding: 0 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .btn-small:active { background: rgba(255,255,255,0.2); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        /* 工具类 */
        .hidden { display: none !important; }
        .text-cyan { color: var(--accent-cyan); }
        
        /* 平板/桌面端适配 (Landscape) */
        @media (min-width: 768px) {
            body {
                grid-template-columns: 1fr 380px;
                grid-template-rows: auto auto 1fr;
                grid-template-areas: 
                    "header header"
                    "settings settings"
                    "viz controls";
            }

            .controls-area {
                height: auto; /* 让 grid 决定高度 */
                max-height: none;
                border-top: 1px solid var(--border-color); /* 恢复全边框 */
                margin: 10px; /* 统一边距 */
                padding-bottom: 20px;
            }

            .viz-container {
                height: auto; /* 让 grid 决定高度 */
                margin: 10px; /* 统一边距 */
            }
            
            /* 在宽屏下增加台站列数 - 统一使用自适应 */
            .station-list {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--panel-bg);
            width: 90%; max-width: 600px; max-height: 80vh;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { margin: 0; color: var(--text-main); font-size: 1.2rem; }
        .btn-icon { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0 5px; }
        .qso-list {
            flex: 1; overflow-y: auto; padding: 0;
        }
        .qso-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .qso-item:last-child { border-bottom: none; }
        .qso-info { display: flex; flex-direction: column; gap: 4px; }
        .qso-call { font-weight: bold; color: var(--text-main); font-size: 1.1rem; display: flex; align-items: center; }
        .qso-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 10px; }
        .qso-freq { color: var(--accent-green); font-family: monospace; }
        .qso-mode { background: rgba(255, 152, 0, 0.2); color: var(--accent-cyan); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 8px; }
        .qso-time { font-size: 0.8rem; color: #666; }

        /* 实时字幕覆盖层 */
        .subtitle-overlay {
            position: absolute;

    <script>
        // --- 核心类定义区域 ---
        
        /** 音量条控制器 */
        class VolumeSlider {
            constructor(container, player) {
                this.container = container;
                this.player = player;
                this.trackWrapper = container.querySelector('#vol-track-wrapper');
                this.fill = container.querySelector('#vol-fill');
                this.text = container.querySelector('#vol-value-text');
                this.muteBtn = container.querySelector('#vol-mute-btn');
                
                this.isDragging = false;
                this.value = 1.0; // 0.0 - 1.0
                
                this.initEvents();
                this.updateUI(this.value);
            }

            initEvents() {
                // 点击或拖动处理
                const updateFromEvent = (e) => {
                    const rect = this.trackWrapper.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let percent = (clientX - rect.left) / rect.width;
                    percent = Math.max(0, Math.min(1, percent));
                    
                    this.setVolume(percent);
                };

                // 鼠标事件
                this.trackWrapper.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    updateFromEvent(e);
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                const onMove = (e) => {
                    if (this.isDragging) {
                        updateFromEvent(e);
                        e.preventDefault();
                    }
                };

                const onUp = () => {
                    this.isDragging = false;
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                };

                // 触摸事件
                this.trackWrapper.addEventListener('touchstart', (e) => {
                    this.isDragging = true;
                    updateFromEvent(e);
                    document.addEventListener('touchmove', onTouchMove, { passive: false });
                    document.addEventListener('touchend', onTouchEnd);
                });

                const onTouchMove = (e) => {
                    if (this.isDragging) {
                        updateFromEvent(e);
                        e.preventDefault();
                    }
                };

                const onTouchEnd = () => {
                    this.isDragging = false;
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                // 静音切换
                this.muteBtn.addEventListener('click', () => {
                    if (this.value > 0) {
                        this.lastValue = this.value;
                        this.setVolume(0);
                    } else {
                        this.setVolume(this.lastValue || 0.5);
                    }
                    // 震动
                    if (navigator.vibrate) navigator.vibrate(10);
                });
            }

            setVolume(val) {
                this.value = val;
                this.player.setVolume(val); // 假设 player 支持 0-1
                this.updateUI(val);
                // 保存音量设置
                if (window.settingsMgr) {
                    window.settingsMgr.setVolume(val);
                }
            }

            updateUI(val) {
                const percent = Math.round(val * 100);
                this.fill.style.width = `${percent}%`;
                this.text.textContent = `${percent}%`;
                
                // 更新图标状态
                if (val === 0) {
                    this.muteBtn.style.opacity = '0.5';
                    this.muteBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
                } else {
                    this.muteBtn.style.opacity = '1';
                    this.muteBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
                }
            }
        }

        /** 基础事件发射器 */
        class EventEmitter {
            constructor() { this.events = {}; }
            on(event, listener) {
                if (!this.events[event]) this.events[event] = [];
                this.events[event].push(listener);
            }
            emit(event, ...args) {
                if (this.events[event]) this.events[event].forEach(fn => fn(...args));
            }
        }

        /** WebSocket 控制客户端 */
        class ControlClient extends EventEmitter {
            constructor() {
                super();
                // 配置常量 - 提取以提高可维护性
                this.CONFIG = {
                    FETCH_PAGE_SIZE: 20,
                    AUTO_REFRESH_INTERVAL: 30000,
                    RECONNECT_DELAY: 3000,
                    POST_SWITCH_DELAY: 3000
                };

                this.ws = null;
                this.connected = false;
                this.reconnectTimer = null;
                this.autoUpdateTimer = null; // 自动更新定时器
                this.host = '';
                this.stationList = []; // 存储所有已加载的台站
                this.currentStationId = null; // 当前台站ID
                
                // 全量加载状态管理
                this.fetchingAll = false;
                this.tempStationList = [];
                this.fetchStart = 0;
                this.fetchPageSize = this.CONFIG.FETCH_PAGE_SIZE; // 每次获取限制
            }

            connect(host) {
                // 重置加载状态，确保每次连接都能重新获取
                this.fetchingAll = false;
                this.tempStationList = [];
                this.fetchStart = 0;

                this.host = host;
                if (this.ws) {
                    // 关闭旧连接前清除定时器
                    this.stopAutoRefresh();
                    this.ws.close();
                    this.ws = null;
                }
                
                // 关闭旧的events连接（如果有）

                try {
                    this.ws = new WebSocket(`ws://${this.host}/ws`);
                    
                this.ws.onopen = () => {
                    this.connected = true;
                    this.emit('status', true);
                    this.stationList = []; // 重置列表
                    // 连接后自动获取所有列表和当前台站
                    this.fetchList(); // 初始加载
                    this.send('station', 'getCurrent');

                    // 开启30秒自动更新
                    this.startAutoRefresh();
                };

                    this.ws.onclose = () => {
                        this.connected = false;
                        this.emit('status', false);
                        
                        // 清除自动更新
                        this.stopAutoRefresh();

                        // 3秒后重连
                        clearTimeout(this.reconnectTimer);
                        this.reconnectTimer = setTimeout(() => this.connect(this.host), this.CONFIG.RECONNECT_DELAY);
                    };

                    this.ws.onerror = (e) => {
                        this.connected = false;
                        this.emit('status', false);
                    };

                    this.ws.onmessage = (e) => {
                        try {
                            const msg = JSON.parse(e.data);
                            this.handleMessage(msg);
                        } catch (err) {
                            console.error('Parse Error:', err);
                        }
                    };

                } catch (e) {
                    console.error('Connection Failed:', e);
                    this.emit('status', false);
                }
            }
            
            

            send(type, subType, data = {}) {
                if (!this.connected || !this.ws) return;
                this.ws.send(JSON.stringify({ type, subType, data }));
            }

            handleMessage(msg) {
                // 路由不同类型的消息
                if (msg.type === 'station') {
                    switch (msg.subType) {
                        case 'getListResponse':
                            const newList = msg.data.list || [];
                            const start = msg.data.start;

                            // 如果正在进行全量加载流程
                            if (this.fetchingAll) {
                                // 校验 start (如果服务器返回了 start)
                                if (start !== undefined && start !== this.fetchStart) {
                                    // 加载顺序不匹配，停止加载
                                    this.fetchingAll = false;
                                    return;
                                }

                                this.tempStationList = this.tempStationList.concat(newList);
                                
                                // 检查是否还有更多数据
                                // 如果返回的数量少于请求的数量，说明是最后一页
                                if (newList.length < this.fetchPageSize) {
                                    // 加载完成
                                    this.stationList = this.tempStationList;
                                    this.fetchingAll = false;
                                    this.tempStationList = [];
                                    
                                    // 过滤空值
                                    this.stationList = this.stationList.filter(i => i);
                                    this.emit('stationList', this.stationList);
                                } else {
                                    // 继续获取下一页
                                    this.fetchStart += this.fetchPageSize;
                                    this.send('station', 'getListRange', { start: this.fetchStart, count: this.fetchPageSize });
                                }
                            } else {
                                // 非全量加载模式（兼容旧逻辑或单次更新）
                                if ((start === 0 || start === undefined) && newList.length > 0) {
                                    this.stationList = newList;
                                    this.emit('stationList', this.stationList);
                                }
                            }
                            break;
                        case 'getCurrentResponse':
                            if (msg.data && msg.data.uid) {
                                this.currentStationId = msg.data.uid;
                            }
                            this.emit('stationCurrent', msg.data);
                            break;
                        case 'setCurrentResponse':
                            // 操作结果，可加 Toast
                            break;
                    }
                } else if (msg.type === 'qso') {
                    this.emit('qsoMessage', msg);
                }
            }

            // 快捷指令
            setStation(uid) { 
                // 乐观更新：立即更新本地状态，解决连续点击失效问题
                this.currentStationId = uid;
                
                this.send('station', 'setCurrent', { uid }); 
                // Delay before fetching current station to ensure server state update
                setTimeout(() => this.send('station', 'getCurrent'), this.CONFIG.POST_SWITCH_DELAY);
            }

            nextStation() { 
                this.send('station', 'next');
                // Delay before fetching current station to ensure server state update
                setTimeout(() => this.send('station', 'getCurrent'), this.CONFIG.POST_SWITCH_DELAY);
            }

            prevStation() { 
                this.send('station', 'prev');

            // 全量获取逻辑 (递归/分片获取)
            fetchList() {

                this.fetchingAll = true;
                this.tempStationList = [];
                this.fetchStart = 0;
                
                // 发起第一次请求
                this.send('station', 'getListRange', { start: 0, count: this.fetchPageSize });

        /** 音频播放器 (PCM 流处理) */
        class AudioPlayer extends EventEmitter {
            constructor() {
                super();
                this.audioCtx = null;
                this.ws = null;
                this.connected = false;
                this.analyser = null;
                this.gainNode = null;
                this.hpfNode = null;
                
                // 缓冲调度相关
                this.chunkQueue = [];
                this.scheduledEndTime = 0;
                this.started = false;
                this.buffering = true;
                
                // 音频参数
                this.sampleRate = 8000;
                this.targetLead = 0.5; // 目标领先时间(s)

                // 录音相关
                this.recording = false;
                this.recordedChunks = [];
            }
            
            async ensureAudioContext() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 2048; // 高分辨率
                    this.analyser.smoothingTimeConstant = 0.8;
                    
                    this.gainNode = this.audioCtx.createGain();
                    this.gainNode.gain.value = 1.0;

                    // 300Hz HPF to remove sub-audible tones (CTCSS/DCS)
                    this.hpfNode = this.audioCtx.createBiquadFilter();
                    this.hpfNode.type = 'highpass';
                    this.hpfNode.frequency.value = 300;

                    // 连线: Source -> Gain -> HPF -> Analyser -> Dest
                    this.gainNode.connect(this.hpfNode);
                    this.hpfNode.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                }
                if (this.audioCtx.state === 'suspended') {
                    try {
                        await this.audioCtx.resume();
                    } catch (e) {
                        console.warn('Auto-resume failed, waiting for user gesture.');
                    }
                }
            }

            unlock() {
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume().then(() => {
                        console.log('AudioContext resumed via user interaction');
                    }).catch(e => console.error(e));
                }
            }

            async connect(host) {
                if (this.connected) return;
                await this.ensureAudioContext();
                
                // 重置状态
                this.chunkQueue = [];
                this.scheduledEndTime = this.audioCtx.currentTime;
                this.started = false;
                this.buffering = true;

                try {
                    this.ws = new WebSocket(`ws://${host}/audio`);
                    this.ws.binaryType = 'arraybuffer';

                    this.ws.onopen = () => {
                        this.connected = true;
                        this.emit('status', true);
                    };

                    this.ws.onclose = () => {
                        this.connected = false;
                        this.emit('status', false);
                    };

                    this.ws.onmessage = (e) => {
                        if (e.data instanceof ArrayBuffer) {
                            this.handlePCM(e.data);
                        }
                    };
                } catch (e) {
                    console.error('Audio Connect Failed:', e);
                }
            }

            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
                this.connected = false;
                this.emit('status', false);
            }

            handlePCM(buffer) {
                // 录音收集
                if (this.recording) {
                    this.recordedChunks.push(buffer.slice(0));
                }

                // PCM16 -> Float32
                const int16 = new Int16Array(buffer);
                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) {
                    float32[i] = int16[i] / 32768;
                }
                
                this.chunkQueue.push(float32);
                this.schedule();
            }

            schedule() {
                if (!this.audioCtx) return;
                
                if (this.audioCtx.state === 'suspended') return;

                const now = this.audioCtx.currentTime;
                if (this.scheduledEndTime < now) this.scheduledEndTime = now;

                // 简单的缓冲策略
                if (this.buffering) {
                    // 积攒约 0.5s 数据再开始
                    const totalSamples = this.chunkQueue.reduce((acc, c) => acc + c.length, 0);
                    if (totalSamples / this.sampleRate > 0.5) {
                        this.buffering = false;
                        this.started = true;
                    } else {
                        return;
                    }
                }

                // 调度所有队列中的块
                while (this.chunkQueue.length) {
                    const chunk = this.chunkQueue.shift();
                    const buffer = this.audioCtx.createBuffer(1, chunk.length, this.sampleRate);
                    buffer.copyToChannel(chunk, 0);

                    const source = this.audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(this.gainNode);
                    source.start(this.scheduledEndTime);

                    this.scheduledEndTime += chunk.length / this.sampleRate;
                }
            }

            setVolume(val) {
                if (this.gainNode) this.gainNode.gain.value = val;
            }

            startRecording() {
                this.recording = true;
                this.recordedChunks = [];
            }

            stopRecording() {
                this.recording = false;
                const blob = this.exportWAV();
                this.recordedChunks = [];
                return blob;
            }

            async getRecordingAsBase64() {
                const blob = this.exportWAV();
                if (!blob) return null;
                
                this.recording = false;
                this.recordedChunks = [];
                
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64 = reader.result.split(',')[1];
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }

            exportWAV() {
                if (this.recordedChunks.length === 0) return null;
                const totalLen = this.recordedChunks.reduce((acc, c) => acc + c.byteLength, 0);
                const buffer = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of this.recordedChunks) {
                    buffer.set(new Uint8Array(chunk), offset);
                    offset += chunk.byteLength;
                }
                
                const wavHeader = this.createWavHeader(totalLen, 1, this.sampleRate, 16);
                return new Blob([wavHeader, buffer], { type: 'audio/wav' });
            }

            createWavHeader(dataLength, numChannels, sampleRate, bitsPerSample) {
                const header = new ArrayBuffer(44);
                const view = new DataView(header);
                
                this.writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + dataLength, true);
                this.writeString(view, 8, 'WAVE');
                this.writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true); 
                view.setUint16(20, 1, true); 
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * bitsPerSample / 8, true); 
                view.setUint16(32, numChannels * bitsPerSample / 8, true); 
                view.setUint16(34, bitsPerSample, true);
                this.writeString(view, 36, 'data');
                view.setUint32(40, dataLength, true);
                
                return header;
            }
            
            writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
        }

/**
 * 基础渲染器模块
 * Base class for all visualizer renderers
 */
class BaseRenderer {
    /**
     * @param {CanvasRenderingContext2D} ctx 
     */
    constructor(ctx) { 
        this.ctx = ctx; 
        this.width = 0; 
        this.height = 0; 
    }

    /**
     * Update dimensions
     * @param {number} w Width
     * @param {number} h Height
     */
    resize(w, h) { 
        this.width = w; 
        this.height = h; 
    }

    /**
     * Legacy Sci-Fi Plane Renderer (Appears unused in current implementation)
     * @param {number} w 
     * @param {number} h 
     * @param {number} bass 
     * @param {object} theme 
     */
    drawSciFiPlane(w, h, bass, theme) {
        const ctx = this.ctx;
        const cx = w / 2;
        const cy = h / 2;
        const size = Math.min(w, h) / 5;
        const time = Date.now() / 1000;
        
        // Sway animation (Hovering effect)
        const swayX = Math.sin(time * 0.8) * size * 0.05;
        const swayY = Math.cos(time * 0.5) * size * 0.05;
        
        ctx.save();
        ctx.translate(cx + swayX, cy + swayY);
        ctx.scale(size, size);
        
        // Draw Shadow (to make it pop from stars)
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        
        // 1. Engine Glow (Reactive)
        const glowIntensity = 0.6 + bass * 0.4;
        const glowColor = '#00f3ff'; // Cyan glow
        
        // Engines (Twin)
        ctx.fillStyle = `rgba(0, 243, 255, ${glowIntensity})`;
        ctx.shadowBlur = 20 * glowIntensity;
        ctx.shadowColor = glowColor;
        
        // Left Engine
        ctx.beginPath();
        ctx.arc(-0.15, 0.35, 0.06, 0, Math.PI * 2);
        ctx.fill();
        
        // Right Engine
        ctx.beginPath();
        ctx.arc(0.15, 0.35, 0.06, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        
        // 2. Main Body (Fuselage)
        // Gradient for metallic look
        const bodyGrad = ctx.createLinearGradient(0, -0.6, 0, 0.6);
        bodyGrad.addColorStop(0, '#f0f0f0');
        bodyGrad.addColorStop(0.5, '#b0b0b0');
        bodyGrad.addColorStop(1, '#808080');
        
        ctx.fillStyle = bodyGrad;
        
        // Central Fuselage
        ctx.beginPath();
        ctx.moveTo(0, -0.7); // Nose tip
        ctx.lineTo(0.08, -0.3);
        ctx.lineTo(0.12, 0.4); 
        ctx.lineTo(0, 0.5); // Tail cone
        ctx.lineTo(-0.12, 0.4);
        ctx.lineTo(-0.08, -0.3);
        ctx.closePath();
        ctx.fill();
        
        // 3. Wings (Delta)
        ctx.fillStyle = '#d0d0d0';
        ctx.beginPath();
        ctx.moveTo(0.08, -0.1);
        ctx.lineTo(0.5, 0.3); // Wing tip
        ctx.lineTo(0.12, 0.4); // Wing root rear
        ctx.closePath();
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(-0.08, -0.1);
        ctx.lineTo(-0.5, 0.3);
        ctx.lineTo(-0.12, 0.4);
        ctx.closePath();
        ctx.fill();
        
        // Wing details (lines)
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 0.005;
        ctx.beginPath();
        ctx.moveTo(0.1, 0); ctx.lineTo(0.4, 0.3);
        ctx.moveTo(-0.1, 0); ctx.lineTo(-0.4, 0.3);
        ctx.stroke();
        
        // 4. Canards (Front wings)
        ctx.fillStyle = '#c0c0c0';
        ctx.beginPath();
        ctx.moveTo(0.08, -0.4);
        ctx.lineTo(0.25, -0.25);
        ctx.lineTo(0.08, -0.2);
        ctx.closePath();
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(-0.08, -0.4);
        ctx.lineTo(-0.25, -0.25);
        ctx.lineTo(-0.08, -0.2);
        ctx.closePath();
        ctx.fill();
        
        // 5. Vertical Stabilizers (Canted V-Tail)
        ctx.fillStyle = '#a0a0a0';
        ctx.beginPath();
        ctx.moveTo(0.1, 0.2);
        ctx.lineTo(0.22, 0.5);
        ctx.lineTo(0.1, 0.45);
        ctx.closePath();
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(-0.1, 0.2);
        ctx.lineTo(-0.22, 0.5);
        ctx.lineTo(-0.1, 0.45);
        ctx.closePath();
        ctx.fill();
        
        // 6. Cockpit Canopy
        const cockpitGrad = ctx.createLinearGradient(0, -0.5, 0, -0.3);
        cockpitGrad.addColorStop(0, '#111');
        cockpitGrad.addColorStop(1, '#333');
        ctx.fillStyle = cockpitGrad;
        
        ctx.beginPath();
        ctx.moveTo(0, -0.55);
        ctx.lineTo(0.04, -0.4);
        ctx.lineTo(0, -0.35);
        ctx.lineTo(-0.04, -0.4);
        ctx.closePath();
        ctx.fill();
        
        // Cockpit Glint
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.ellipse(0, -0.45, 0.01, 0.03, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    /**
     * Abstract draw method
     * @param {AnalyserNode} analyser 
     * @param {Uint8Array} dataArray 
     * @param {number} bufferLength 
     * @param {object} theme 
     * @param {object} [extra] 
     */
    draw(analyser, dataArray, bufferLength, theme, extra) {}
    
    /**
     * Draw standardized time display
     * @param {object} theme 
     */
    drawTime(theme) {
        const { ctx, width: w, height: h } = this;
        const minDim = Math.min(w, h);
        
        if (minDim > 280) {
            const now = new Date();
            const offset = 8;
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const bjTime = new Date(utc + (3600000 * offset));
            
            const pad = (n) => n.toString().padStart(2, '0');
            const sec = bjTime.getSeconds();
            const ms = bjTime.getMilliseconds();
            // 2 decimal places for seconds: SS.ss
            const secStr = sec.toString().padStart(2, '0');
            const msStr = Math.floor(ms / 10).toString().padStart(2, '0');
            
            const fullTimeStr = `${bjTime.getFullYear()}-${pad(bjTime.getMonth()+1)}-${pad(bjTime.getDate())} ${pad(bjTime.getHours())}:${pad(bjTime.getMinutes())}:${secStr}.${msStr}`;
            
            const timeSize = Math.max(14, Math.floor(minDim / 40));

            ctx.save();
            ctx.fillStyle = theme.primary || '#00f3ff'; 
            ctx.shadowColor = theme.primary || '#00f3ff'; 
            ctx.shadowBlur = 10;
            ctx.font = `bold ${timeSize}px "Courier New", monospace`; 
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'top';
            ctx.fillText(fullTimeStr, w / 2, 30);
            ctx.restore();
        }
    }
}

/**
 * @fileoverview Star field and repeater station renderer for Solar System visualization
 */

/**
 * Manages the background star field and dynamic repeater station visualization
 */
class StarField {
    constructor() {
        /** @type {Array<Object>} Background stars */
        this.stars = [];
        /** @type {Array<Object>} Active repeater station stars */
        this.repeaterStars = [];
        /** @type {Array<Object>} Available repeater station data */
        this.repeaterStations = [];
        
        /** @type {number} Global rotation angle for stars */
        this.starRotation = 0;
        
        // Repeater spawning configuration
        this.repeaterSpawnTimer = 0;
        this.repeaterSpawnInterval = 5000; // 5 seconds
        this.repeaterFadeInterval = 10000; // 10 seconds active
        
        this.initStars();
    }

    /**
     * Initialize background stars
     * @private
     */
    initStars() {
        for(let i = 0; i < 300; i++) {
            this.stars.push({
                r: Math.random() * 1.5, // Normalized polar radius
                angle: Math.random() * Math.PI * 2,
                size: Math.random() * 2.5 + 0.5,
                blinkSpeed: Math.random() * 0.005 + 0.002,
                blinkPhase: Math.random() * Math.PI * 2,
                baseAlpha: Math.random() * 0.5 + 0.2
            });
        }
    }

    /**
     * Update the list of available repeater stations
     * @param {Array<Object>} stations 
     */
    updateRepeaterStations(stations) {
        this.repeaterStations = stations.filter(s => s.name && s.name.length > 0);
    }

    /**
     * Render the star field and repeaters
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} width Canvas width
     * @param {number} height Canvas height
     * @param {number} energy Audio energy level (0-1) for twinkling
     * @param {Object} theme Theme colors
     */
    render(ctx, width, height, energy, theme) {
        const nowTime = Date.now();
        const cx = width / 2;
        const cy = height / 2;
        const maxDim = Math.max(width, height);
        const minDim = Math.min(width, height); // ADAPT: minDim was undefined; repeater-label check below would throw
        
        this.starRotation += 0.0001;
        this.repeaterSpawnTimer += 16; // Assuming ~60fps call rate

        // --- Handle Repeater Spawning ---
        if (this.repeaterSpawnTimer >= this.repeaterSpawnInterval && this.repeaterStations.length > 0) {
            this.repeaterSpawnTimer = 0;
            // Randomly select 5-9 repeaters
            const count = Math.floor(Math.random() * 5) + 5;
            const shuffled = [...this.repeaterStations].sort(() => Math.random() - 0.5);
            const selectedRepeater = shuffled.slice(0, count);

            selectedRepeater.forEach(station => {
                const exists = this.repeaterStars.find(rs => rs.uid === station.uid);
                if (!exists) {
                    const starIndex = Math.floor(Math.random() * this.stars.length);
                    // Ensure star isn't already used
                    if (!this.repeaterStars.some(rs => rs.starIndex === starIndex)) {
                        this.repeaterStars.push({
                            ...station,
                            starIndex: starIndex,
                            spawnTime: nowTime,
                            alpha: 0,
                            phase: 'spawning', // spawning -> visible -> fading
                            blinkOffset: Math.random() * Math.PI * 2,
                            visibleStartTime: 0 // Set when fully spawned
                        });
                    }
                }
            });
        }

        // --- Render Repeaters ---
        // Iterate backwards to allow removal
        for (let i = this.repeaterStars.length - 1; i >= 0; i--) {
            const rs = this.repeaterStars[i];
            const baseStar = this.stars[rs.starIndex];
            
            if (!baseStar) {
                this.repeaterStars.splice(i, 1);
                continue;
            }

            // Lifecycle State Machine
            if (rs.phase === 'spawning') {
                rs.alpha += 0.05;
                if (rs.alpha >= 1) {
                    rs.alpha = 1;
                    rs.phase = 'visible';
                    rs.visibleStartTime = nowTime;
                }
            } else if (rs.phase === 'visible') {
                if (nowTime - rs.visibleStartTime > this.repeaterFadeInterval) {
                    rs.phase = 'fading';
                }
            } else if (rs.phase === 'fading') {
                rs.alpha -= 0.02;
                if (rs.alpha <= 0) {
                    this.repeaterStars.splice(i, 1);
                    continue;
                }
            }

            const blink = Math.sin(nowTime * baseStar.blinkSpeed + baseStar.blinkPhase + rs.blinkOffset);
            const starAlpha = Math.max(0.1, Math.min(1, baseStar.baseAlpha + blink * 0.3 + energy * 0.5));
            const finalAlpha = starAlpha * rs.alpha;

            const currentAngle = baseStar.angle + this.starRotation;
            const x = cx + Math.cos(currentAngle) * baseStar.r * maxDim * 0.8;
            const y = cy + Math.sin(currentAngle) * baseStar.r * maxDim * 0.8;

            // Glow
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = theme.primary || '#ff9800';
            ctx.fillStyle = `rgba(255, 200, 100, ${finalAlpha * 0.6})`;
            ctx.beginPath();
            ctx.arc(x, y, baseStar.size * 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Core
            ctx.fillStyle = `rgba(255, 220, 150, ${finalAlpha})`;
            ctx.beginPath();
            ctx.arc(x, y, baseStar.size, 0, Math.PI * 2);
            ctx.fill();

            // Label
            // Only draw label if screen is large enough (minDim > 320px) to prevent clutter
            if (rs.alpha > 0.5 && rs.name && minDim > 320) {
                this.drawRepeaterLabel(ctx, x, y, rs.name, finalAlpha);
            }
        }

        // --- Render Background Stars ---
        this.stars.forEach((star, idx) => {
            // Skip stars currently occupied by repeaters
            if (this.repeaterStars.some(rs => rs.starIndex === idx)) return;

            const blink = Math.sin(nowTime * star.blinkSpeed + star.blinkPhase);
            const alpha = Math.max(0.1, Math.min(1, star.baseAlpha + blink * 0.3 + energy * 0.5));

            const currentAngle = star.angle + this.starRotation;
            const x = cx + Math.cos(currentAngle) * star.r * maxDim * 0.8;
            const y = cy + Math.sin(currentAngle) * star.r * maxDim * 0.8;

            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    /**
     * Draw the repeater station label
     * @private
     */
    drawRepeaterLabel(ctx, x, y, text, alpha) {
        ctx.save();
        ctx.font = 'bold 10px "Roboto Mono"';
        const textMetrics = ctx.measureText(text);
        const textW = textMetrics.width;
        const textH = 14;

        // Background
        ctx.fillStyle = `rgba(255, 152, 0, ${alpha * 0.7})`;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.roundRect(x - textW / 2 - 4, y - textH - 8, textW + 8, textH, 4);
        ctx.fill();

        // Text
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y - 14);
        ctx.restore();
    }
}

/**
 * @fileoverview Planet system renderer (Sun, Planets, Moons)
 */


class PlanetSystem {
    constructor() {
        this.planets = PLANETS_DATA;
        this.targets = [];
        this.initTargets();
        
        // Sun Eruption System Configuration
        this.eruptions = [];
        this.eruptionConfig = {
            sensitivity: 1.0,
            randomness: 0.5,
            intensity: 1.0,
            speed: 0.5
        };
    }

    /**
     * Initialize callsign assignment targets (Planets + Moons)
     */
    initTargets() {
        this.targets = [];
        this.planets.forEach((p, pIdx) => {
            this.targets.push({ type: 'planet', pIdx: pIdx, name: p.name });
            if (p.moons) {
                p.moons.forEach((m, mIdx) => {
                    this.targets.push({ type: 'moon', pIdx: pIdx, mIdx: mIdx, name: m.name });
                });
            }
        });
    }

    /**
     * Get a target based on hash
     * @param {number} hash 
     * @returns {Object} Target info
     */
    getTarget(hash) {
        if (this.targets.length === 0) return null;
        return this.targets[Math.abs(hash) % this.targets.length];
    }

    /**
     * Determine text color based on background brightness
     * @param {string} hex 
     * @returns {string} '#000000' or '#ffffff'
     */
    getTextColor(hex) {
        if(!hex || hex[0]!=='#') return '#ffffff';
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return (r*0.299 + g*0.587 + b*0.114) > 160 ? '#000000' : '#ffffff';
    }

    /**
     * Render the entire planet system
     * @param {CanvasRenderingContext2D} ctx 
     * @param {Object} params Rendering parameters
     * @returns {Object|null} Hovered item info if any
     */
    render(ctx, params) {
        const { 
            cx, cy, scale, tilt, angleOffset, orbitSpeedScale,
            bass, mid, treble, energy, 
            theme, input, callsign, activeTarget, minDim 
        } = params;

        const renderList = [];
        let hoveredItem = null;

        // --- 0. 轨道环（修复：原版根本没画轨道，行星看起来是散的）---
        this.planets.forEach((p) => {
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, cy, p.dist * scale, p.dist * scale * tilt, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        });

        // --- 1. Sun & Eruptions ---
        renderList.push({
            y: cy,
            draw: () => {
                const sunBaseSize = 25; 
                const sunSize = sunBaseSize + bass * 30;

                // Eruptions
                const sensitivity = this.eruptionConfig.sensitivity;
                if (energy * sensitivity > 0.05) { 
                    const count = Math.floor(energy * 8 * sensitivity); 
                    let colorBase = '255, 69, 0'; 
                    let type = 'bass';
                    if (treble > mid && treble > bass) { colorBase = '200, 255, 255'; type = 'treble'; } 
                    else if (mid > bass) { colorBase = '255, 215, 0'; type = 'mid'; }

                    for(let k=0; k<count; k++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speedVar = Math.random() * this.eruptionConfig.randomness;
                        this.eruptions.push({
                            x: cx, y: cy, angle: angle,
                            r: sunSize * 0.8,
                            speed: (2 + speedVar * 5 + energy * 10) * this.eruptionConfig.speed,
                            length: (10 + Math.random() * 20 + energy * 50) * this.eruptionConfig.intensity,
                            width: (type === 'treble' ? 1 : (type === 'mid' ? 2 : 3)) * (1 + Math.random()),
                            colorBase: colorBase, alpha: 0.8 + Math.random() * 0.2, decay: 0.02 + Math.random() * 0.05
                        });
                    }
                }

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let i = this.eruptions.length - 1; i >= 0; i--) {
                    const p = this.eruptions[i];
                    p.r += p.speed;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) { this.eruptions.splice(i, 1); continue; }
                    
                    const sx = cx + Math.cos(p.angle) * p.r;
                    const sy = cy + Math.sin(p.angle) * p.r;
                    const ex = cx + Math.cos(p.angle) * (p.r + p.length);
                    const ey = cy + Math.sin(p.angle) * (p.r + p.length);
                    
                    ctx.strokeStyle = `rgba(${p.colorBase}, ${p.alpha})`;
                    ctx.lineWidth = p.width;
                    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
                }
                ctx.restore();
                
                // Sun Body
                const sunGrad = ctx.createRadialGradient(cx, cy, sunSize*0.2, cx, cy, sunSize);
                sunGrad.addColorStop(0, 'rgba(255, 215, 0, 0.85)'); 
                sunGrad.addColorStop(1, 'rgba(255, 140, 0, 0.65)'); 
                
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, sunSize, 0, Math.PI*2);
                ctx.fill();

                // Sun 名称（修复：原版太阳没名字，Mercury 的名字正好落在太阳下面，
                // 看起来像太阳叫 Mercury）
                if (minDim > 320) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.95)';
                    const sunNameSize = Math.max(10, Math.floor(minDim / 60));
                    ctx.font = `${sunNameSize}px "Roboto Mono"`;
                    ctx.textAlign = 'center';
                    ctx.fillText('Sun', cx, cy + sunSize + sunNameSize + 4);
                }

                // Interaction
                if (input.active && Math.hypot(input.x - cx, input.y - cy) < sunSize + 10) {
                    hoveredItem = { name: 'Sun', info: 'Star Type: G2V', x: cx, y: cy - sunSize - 10 };
                }
            }
        });

        // --- 2. Planets & Moons ---
        this.planets.forEach((p, i) => {
            const angle = angleOffset * p.speed * orbitSpeedScale + i * 137.5; 
            const x = cx + Math.cos(angle) * p.dist * scale;
            const y = cy + Math.sin(angle) * p.dist * scale * tilt;
            
            renderList.push({
                y: y,
                draw: () => {
                    const size = Math.max(3, p.r * scale * 0.12);
                    const style = p.style;

                    // Moons
                    if (p.moons && p.moons.length > 0) {
                        p.moons.forEach((m, idx) => {
                            const mAngle = angleOffset * m.speed * 4 * orbitSpeedScale + idx; 
                            const mDist = (size + m.dist * scale * 2); 
                            const mx = x + Math.cos(mAngle) * mDist;
                            const my = y + Math.sin(mAngle) * mDist * tilt;
                            const mSize = Math.max(2.0, m.r * scale * 0.15);

                            // Moon Body
                            ctx.fillStyle = m.color;
                            ctx.beginPath();
                            ctx.arc(mx, my, mSize, 0, Math.PI*2);
                            ctx.fill();

                            // Moon Interaction
                            if (input.active && Math.hypot(input.x - mx, input.y - my) < mSize + 5) {
                                hoveredItem = { name: m.name, info: `Moon of ${p.name}`, x: mx, y: my - 10 };
                            }

                            // 画布呼号已去掉（2026-11-10）：DOM 字幕是唯一呼号显示，
                            // 避免 BI4AIS 出现两次（中间大牌＋目标旁小牌＋连线）。
                        });
                    }

                    // Planet Body
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI*2);
                    ctx.clip(); 

                    const grad = ctx.createRadialGradient(x - size*0.3, y - size*0.3, size*0.1, x, y, size);
                    grad.addColorStop(0, style.highlight || style.color1);
                    grad.addColorStop(0.5, style.color1);
                    grad.addColorStop(1, style.color2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Planet Details
                    this.drawPlanetDetails(ctx, x, y, size, style);

                    // Planet Shadow
                    const shadowGrad = ctx.createRadialGradient(x, y, size * 0.8, x, y, size);
                    shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
                    shadowGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
                    ctx.fillStyle = shadowGrad;
                    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                    
                    // Planet Name
                    if (minDim > 320) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        const nameSize = Math.max(10, Math.floor(minDim / 60));
                        ctx.font = `${nameSize}px "Roboto Mono"`;
                        ctx.textAlign = 'center';
                        ctx.fillText(p.name, x, y + size + nameSize + 4);
                    }

                    // Planet Interaction
                    if (input.active && Math.hypot(input.x - x, input.y - y) < size + 5) {
                        hoveredItem = { name: p.name, info: `Dist: ${p.dist} AU`, x: x, y: y - size - 10 };
                    }

                    // 画布呼号已去掉（2026-11-10）：DOM 字幕是唯一呼号显示，
                    // 避免 BI4AIS 出现两次（中间大牌＋目标旁小牌＋连线）。
                }
            });
        });

        return { renderList, hoveredItem };
    }

    drawPlanetDetails(ctx, x, y, size, style) {
        if (style.type === 'banded' && style.bands) {
            ctx.globalCompositeOperation = 'overlay';
            const bandHeight = size * 2 / style.bands.length;
            style.bands.forEach((color, idx) => {
                ctx.fillStyle = color;
                ctx.fillRect(x - size, y - size + idx * bandHeight, size * 2, bandHeight);
            });
            ctx.globalCompositeOperation = 'source-over';
        } else if (style.type === 'earth') {
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = '#4CAF50'; 
            ctx.beginPath(); ctx.arc(x - size*0.4, y - size*0.2, size*0.6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; 
            ctx.beginPath(); ctx.arc(x + size*0.3, y + size*0.3, size*0.7, 0, Math.PI*2); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        } else if (style.type === 'crater' || style.type === 'rust') {
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let k=0; k<3; k++) {
                ctx.beginPath(); ctx.arc(x + (Math.random()-0.5)*size, y + (Math.random()-0.5)*size, size*0.2, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }
    }

    drawCallsign(ctx, cx, cy, tx, ty, tSize, color, callsign, theme) {
        // Line
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty);
        ctx.strokeStyle = theme.primary; ctx.globalAlpha = 0.3; ctx.stroke(); ctx.globalAlpha = 1.0;

        // Background
        ctx.save();
        ctx.translate(tx, ty - tSize * 2.5 - 5); // Adjusted offset
        
        ctx.font = 'bold 12px "Roboto Mono"';
        const textMetrics = ctx.measureText(callsign);
        const bgW = textMetrics.width + 16;
        const bgH = 20;
        
        ctx.fillStyle = color; 
        ctx.globalAlpha = 0.8;
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        
        ctx.beginPath();
        ctx.roundRect(-bgW/2, -bgH/2 - 5, bgW, bgH, 10);
        ctx.fill();
        
        ctx.fillStyle = this.getTextColor(color);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 0; 
        ctx.fillText(callsign, 0, -5);
        ctx.restore();
    }
}

/**
 * UFO Easter Egg Controller
 */
class UFOController {
    constructor() {
        this.active = false;
        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.size = 2.0;
        this.angle = 0;
        
        // Bezier points
        this.p0 = { x: 0, y: 0 };
        this.p1 = { x: 0, y: 0 };
        this.p2 = { x: 0, y: 0 };
        
        this.t = 0;
        this.tSpeed = 0.001;
        
        this.shape = 'classic';
        this.colorBody = '#e0e0e0';
        this.colorDome = '#a0a0a0';
    }

    /**
     * Trigger a new UFO flight
     * @param {number} w Screen width
     * @param {number} h Screen height
     */
    trigger(w, h) {
        if (this.active) return;
        
        const offset = 100;
        const side = Math.floor(Math.random() * 4);
        let startX, startY;
        
        switch(side) {
            case 0: startX = Math.random() * w; startY = -offset; break; // Top
            case 1: startX = w + offset; startY = Math.random() * h; break; // Right
            case 2: startX = Math.random() * w; startY = h + offset; break; // Bottom
            case 3: startX = -offset; startY = Math.random() * h; break; // Left
        }
        
        // Target central area
        const targetX = w/2 + (Math.random() - 0.5) * w * 0.5;
        const targetY = h/2 + (Math.random() - 0.5) * h * 0.5;
        
        const dx = targetX - startX;
        const dy = targetY - startY;
        
        const extendFactor = 4.0;
        const p2x = startX + dx * extendFactor;
        const p2y = startY + dy * extendFactor;
        
        const midX = (startX + p2x) / 2;
        const midY = (startY + p2y) / 2;
        
        const dist = Math.sqrt(dx*dx + dy*dy);
        const perpX = -dy / dist;
        const perpY = dx / dist;
        
        const curveDirection = Math.random() < 0.5 ? 1 : -1;
        const curveIntensity = (Math.min(w, h) * 0.8) * (0.8 + Math.random()); 
        
        const p1x = midX + perpX * curveIntensity * curveDirection;
        const p1y = midY + perpY * curveIntensity * curveDirection;
        
        this.p0 = { x: startX, y: startY };
        this.p1 = { x: p1x, y: p1y };
        this.p2 = { x: p2x, y: p2y };
        
        this.t = 0;
        const desiredDuration = 10 + Math.random() * 5; // 10-15s
        this.tSpeed = 1.0 / (desiredDuration * 60);

        this.size = 1.0 + Math.random() * 3.0; 
        
        const shapes = ['classic', 'triangle', 'cigar', 'orb'];
        this.shape = shapes[Math.floor(Math.random() * shapes.length)];

        const hue = Math.floor(Math.random() * 360);
        this.colorBody = `hsl(${hue}, 80%, 85%)`; 
        this.colorDome = `hsl(${hue}, 80%, 50%)`; 
        
        this.active = true;
        this.angle = 0;
    }

    /**
     * Update UFO state
     * @returns {boolean} True if active, false if finished
     */
    update() {
        if (!this.active) return false;
        
        this.t += this.tSpeed;
        
        if (this.t > 1.0) {
            this.active = false;
            return false;
        }
        
        const t = this.t;
        const invT = 1 - t;
        
        const nextX = (invT * invT * this.p0.x) + (2 * invT * t * this.p1.x) + (t * t * this.p2.x);
        const nextY = (invT * invT * this.p0.y) + (2 * invT * t * this.p1.y) + (t * t * this.p2.y);
        
        this.vx = nextX - this.x;
        this.vy = nextY - this.y;
        
        this.x = nextX;
        this.y = nextY;
        
        this.angle += 0.05;
        
        return true;
    }

    /**
     * Render the UFO
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} scale 
     */
    render(ctx, scale) {
        if (!this.active) return;
        
        const ufoSize = Math.max(3, this.size * scale * 0.12);
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.atan2(this.vy, this.vx) * 0.1);
        
        const time = Date.now();

        if (this.shape === 'triangle') {
            this.drawTriangle(ctx, ufoSize, time);
        } else if (this.shape === 'cigar') {
            this.drawCigar(ctx, ufoSize, time);
        } else if (this.shape === 'orb') {
            this.drawOrb(ctx, ufoSize);
        } else {
            this.drawClassic(ctx, ufoSize, time);
        }
        
        ctx.restore();
    }

    drawTriangle(ctx, ufoSize, time) {
        ctx.fillStyle = this.colorBody;
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#000000';
        ctx.beginPath();
        ctx.moveTo(ufoSize * 1.2, 0);
        ctx.lineTo(-ufoSize * 0.8, -ufoSize);
        ctx.lineTo(-ufoSize * 0.8, ufoSize);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = this.colorDome;
        ctx.beginPath();
        ctx.arc(-ufoSize*0.2, 0, ufoSize * 0.3, 0, Math.PI * 2);
        ctx.fill();

        const lights = [
            {x: ufoSize * 1.2, y: 0},
            {x: -ufoSize * 0.8, y: -ufoSize},
            {x: -ufoSize * 0.8, y: ufoSize}
        ];
        lights.forEach((l, i) => {
            ctx.fillStyle = (Math.floor(time / 150) + i) % 2 === 0 ? '#ff0000' : '#ffffff';
            ctx.beginPath();
            ctx.arc(l.x, l.y, ufoSize * 0.15, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    drawCigar(ctx, ufoSize, time) {
        const length = ufoSize * 3.0;
        const width = ufoSize * 0.8;
        const halfL = length / 2;
        const radius = width / 2;
        
        ctx.fillStyle = this.colorBody;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.colorDome;
        
        ctx.beginPath();
        ctx.arc(-halfL + radius, 0, radius, Math.PI/2, Math.PI * 1.5);
        ctx.arc(halfL - radius, 0, radius, -Math.PI/2, Math.PI/2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        const windowCount = 5;
        const step = (length - width) / (windowCount - 1);
        const startX = -(length - width) / 2;
        
        for(let i=0; i<windowCount; i++) {
            ctx.fillStyle = (Math.floor(time / 200) + i) % 2 === 0 ? this.colorDome : '#111';
            ctx.beginPath();
            ctx.arc(startX + i * step, 0, width * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawOrb(ctx, ufoSize) {
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.colorDome;
        ctx.beginPath();
        ctx.arc(0, 0, ufoSize * 0.8, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = this.colorBody;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, ufoSize * 1.1, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    drawClassic(ctx, ufoSize, time) {
        ctx.fillStyle = this.colorDome || '#a0a0a0';
        ctx.beginPath();
        ctx.arc(0, -ufoSize*0.3, ufoSize*0.6, Math.PI, 0);
        ctx.fill();
        
        ctx.fillStyle = this.colorBody || '#e0e0e0';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(0, 0, ufoSize, ufoSize*0.4, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        const lightCount = 5;
        for(let k=0; k<lightCount; k++) {
            const la = (k / lightCount) * Math.PI * 2 + this.angle;
            const lx = Math.cos(la) * ufoSize * 0.7;
            const ly = Math.sin(la) * ufoSize * 0.25;
            ctx.fillStyle = (Math.floor(time / 100) + k) % 2 === 0 ? '#ff0000' : '#00ff00';
            ctx.beginPath();
            ctx.arc(lx, ly, ufoSize*0.15, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

/**
