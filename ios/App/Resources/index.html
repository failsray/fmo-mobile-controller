 */


/**
 * Solar System Renderer
 * Renders a realistic solar system with audio-reactive elements,
 * dynamic camera, and easter eggs.
 */
class SolarSystemRenderer extends BaseRenderer {
    /**
     * @param {CanvasRenderingContext2D} ctx 
     */
    constructor(ctx) {
        super(ctx);

        // Sub-systems
        this.starField = new StarField();
        this.planetSystem = new PlanetSystem();
        this.ufoController = new UFOController();

        // Camera / Orbit Settings
        this.baseSpeed = 0.0436; // 120s per Earth orbit
        this.currentSpeed = this.baseSpeed;
        // Random start position for planets
        // 随机初始位置
        this.angleOffset = Math.random() * 1000;
        this.tilt = 0.6; // ~37 degrees
        this.orbitSpeedScale = 0.5;

        // Camera System
        // 摄像机系统
        this.camera = {
            zoom: 1, // Default to see all planets 默认缩放以显示所有行星
            targetZoom: 0.5,
            minZoom: 0.1, // Allow zooming out a bit more if needed
            maxZoom: 2.0,
            zoomSmoothing: 0.01
        };

        // Cloud Particles (Foreground effect)
        this.cloudAngle = 0;
        this.cloudParticles = this.initCloudParticles();

        // State
        this.activeTarget = null;
        this.lastCallsign = '';
    }

    /**
     * Initialize foreground cloud particles
     * @private
     */
    initCloudParticles() {
        // Simple palette for clouds
        const palette = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEEAD',
            '#D4A5A5', '#9B59B6', '#3498DB', '#E67E22', '#2ECC71'
        ];
        const getRandomColor = () => palette[Math.floor(Math.random() * palette.length)];

        return Array.from({length: 40}, () => ({
            x: (Math.random() - 0.5) * 100,
            y: (Math.random() - 0.5) * 60,
            size: Math.random() * 2 + 1,
            color: getRandomColor(),
            alpha: Math.random() * 0.6 + 0.2
        }));
    }

    /**
     * Trigger UFO flight (Easter Egg)
     */
    triggerUFO() {
        this.ufoController.trigger(this.width, this.height);
    }

    /**
     * Adjust Camera Zoom
     * 调整摄像机缩放
     * @param {number} delta Zoom delta 缩放增量
     */
    adjustZoom(delta) {
        this.camera.targetZoom += delta;
        this.camera.targetZoom = Math.max(this.camera.minZoom, Math.min(this.camera.maxZoom, this.camera.targetZoom));
    }

    /**
     * Stop zoom transition immediately
     * 立即停止缩放过渡
     */
    stopZoom() {
        this.camera.targetZoom = this.camera.zoom;
    }

    /**
     * Draw Tooltip for hovered items
     * 绘制悬停提示框
     * @param {CanvasRenderingContext2D} ctx 
     * @param {Object} item 
     * @param {Object} theme 
     */
    drawTooltip(ctx, item, theme) {
        if (!item) return;
        const { x, y, name, info } = item;
        
        ctx.save();
        ctx.font = 'bold 12px "Roboto Mono"';
        const nameMetrics = ctx.measureText(name);
        ctx.font = '10px "Roboto Mono"';
        const infoMetrics = ctx.measureText(info);
        
        const width = Math.max(nameMetrics.width, infoMetrics.width) + 20;
        const height = 40;
        
        // Tooltip Background
        ctx.fillStyle = 'rgba(0, 20, 40, 0.9)';
        ctx.strokeStyle = theme.primary || '#00f3ff';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        // Adjust position to be above the item
        ctx.roundRect(x - width/2, y - height - 10, width, height, 5);
        ctx.fill();
        ctx.stroke();
        
        // Arrow
        ctx.beginPath();
        ctx.moveTo(x - 5, y - 10);
        ctx.lineTo(x, y);
        ctx.lineTo(x + 5, y - 10);
        ctx.fill();
        ctx.stroke();
        
        // Text
        ctx.textAlign = 'center';
        ctx.fillStyle = theme.primary || '#00f3ff';
        ctx.font = 'bold 12px "Roboto Mono"';
        ctx.fillText(name, x, y - height + 8);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px "Roboto Mono"';
        ctx.fillText(info, x, y - height + 24);
        
        ctx.restore();
    }

    /**
     * Main Render Loop
     * @param {AnalyserNode} analyser 
     * @param {Uint8Array} dataArray 
     * @param {number} bufferLength 
     * @param {Object} theme 
     * @param {Object} extra Extra params (callsign, input, etc.)
     */
    draw(analyser, dataArray, bufferLength, theme, extra) {
        analyser.getByteFrequencyData(dataArray);
        const { ctx, width: w, height: h } = this;
        const cx = w / 2;
        const cy = h / 2;
        const minDim = Math.min(w, h);

        // 1. Audio Analysis
        let energy = 0, bass = 0, mid = 0, treble = 0;
        for(let i=0; i<bufferLength; i++) {
            const val = dataArray[i];
            energy += val;
            if(i < 20) bass += val;
            else if(i < 200) mid += val;
            else treble += val;
        }
        energy /= (bufferLength * 255);
        bass /= (20 * 255);
        mid /= (180 * 255);
        treble /= ((bufferLength - 200) * 255);

        // 2. Dynamics Update
        // Accelerate when transmitting (energy > 0)
        const targetSpeed = this.baseSpeed + energy * 6.0;
        this.currentSpeed += (targetSpeed - this.currentSpeed) * 0.05;
        this.angleOffset += this.currentSpeed * 0.01;

        // 3. Callsign & Target Logic
        const callsign = (extra && extra.callsign && extra.opacity > 0) ? extra.callsign : null;
        const input = extra.input || { x: 0, y: 0, active: false };

        if (callsign && callsign !== this.lastCallsign) {
            this.lastCallsign = callsign;
            // Hash callsign to select target
            let hash = 0;
            for (let i = 0; i < callsign.length; i++) hash = callsign.charCodeAt(i) + ((hash << 5) - hash);
            this.activeTarget = this.planetSystem.getTarget(hash);
        }

        // 4. Update Repeater Stations
        if (extra && extra.repeaterStations) {
            this.starField.updateRepeaterStations(extra.repeaterStations);
        }

        // --- RENDER PASS ---

        // A. Background Stars
        this.starField.render(ctx, w, h, energy, theme);

        // Update Camera Zoom (Smooth transition)
        // 更新摄像机缩放（平滑过渡）
        this.camera.zoom += (this.camera.targetZoom - this.camera.zoom) * this.camera.zoomSmoothing;

        // B. Solar System (Sun, Planets, Moons)
        // Scale calculation to fit screen
        // Earth (dist=3.3) should be roughly at 1/3 to 1/2 screen radius
        // Let's say 3.3 AU = 0.35 * minDim
        const baseScale = (minDim * 0.35) / 3.3; 
        const scale = baseScale * this.camera.zoom;

        const planetRenderResult = this.planetSystem.render(ctx, {
            cx, cy, scale, 
            tilt: this.tilt, 
            angleOffset: this.angleOffset, 
            orbitSpeedScale: this.orbitSpeedScale,
            bass, mid, treble, energy,
            theme, input, callsign, 
            activeTarget: this.activeTarget,
            minDim
        });

        // Sort and Draw Planet System Elements (Z-sorting)
        // renderList contains objects with { y, draw() }
        planetRenderResult.renderList.sort((a, b) => a.y - b.y);
        planetRenderResult.renderList.forEach(item => item.draw());

        // C. UFO Overlay (Easter Egg)
        if (this.ufoController.active) {
            this.ufoController.update();
            this.ufoController.render(ctx, scale);
        }

        // D. Foreground Cloud Particles (Top Right Decor)
        this.drawCloudParticles(ctx, w, h, energy);

        // E. Time Display
        this.drawTime(theme);

        // F. Tooltip
        if (planetRenderResult.hoveredItem) {
            this.drawTooltip(ctx, planetRenderResult.hoveredItem, theme);
        }

        // G. Return Interaction Info
        return planetRenderResult.hoveredItem;
    }

    /**
     * Draw decorative cloud particles
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} w 
     * @param {number} h 
     * @param {number} energy 
     */
    drawCloudParticles(ctx, w, h, energy) {
        ctx.save();
        ctx.translate(w - 60, 60); // Top right corner
        this.cloudAngle += 0.005 + energy * 0.02;
        ctx.rotate(this.cloudAngle);
        
        this.cloudParticles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha * (0.5 + energy * 0.5);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.restore();
    }
}

/**
 * @fileoverview Exhaust Particle System for Space Fighters
 */

/**
 * Individual exhaust particle
 */
class ExhaustParticle {
    constructor(x, y, z, vx, vy, vz, life, color, sizeScale = 0.5, baseAlpha = 1.0) {
        this.reset(x, y, z, vx, vy, vz, life, color, sizeScale, baseAlpha);
    }

    reset(x, y, z, vx, vy, vz, life, color, sizeScale, baseAlpha) {
        this.x = x; this.y = y; this.z = z;
        this.vx = vx; this.vy = vy; this.vz = vz;
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.sizeScale = sizeScale;
        this.baseAlpha = baseAlpha;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.z += this.vz * dt;
        this.life -= dt;
        // Turbulence (Cone expansion)
        // Expand more as life decreases (further from source)
        const age = 1.0 - this.life / this.maxLife;
        const expansion = 0.3 * age; // Increased expansion for cone shape
        this.x += (Math.random() - 0.5) * expansion * dt;
        this.y += (Math.random() - 0.5) * expansion * dt;
    }
}

/**
 * Manages exhaust particles for a fighter
 */
class ExhaustSystem {
    constructor(fighterScale = 1.0) {
        this.particles = [];
        this.pool = []; // Object pool for particles
        this.emissionRate = 0.01; // Seconds per particle per nozzle
        this.timer = 0;
        this.fighterScale = fighterScale;
    }

    /**
     * Get particle from pool or create new one
     */
    getParticle(x, y, z, vx, vy, vz, life, color, sizeScale, baseAlpha) {
        if (this.pool.length > 0) {
            const p = this.pool.pop();
            p.reset(x, y, z, vx, vy, vz, life, color, sizeScale, baseAlpha);
            return p;
        }
        return new ExhaustParticle(x, y, z, vx, vy, vz, life, color, sizeScale, baseAlpha);
    }

    /**
     * Return particle to pool
     */
    returnParticle(p) {
        this.pool.push(p);
    }

    /**
     * Update system state
     * @param {number} dt Delta time in seconds
     * @param {Array<Object>} nozzles Array of {x, y, z} positions
     * @param {number} bass Audio bass level (0-1)
     * @param {boolean} isSpeaking Whether someone is speaking
     */
    update(dt, nozzles, bass, isSpeaking = false) {
        // Emit new particles
        const speakingBoost = isSpeaking ? 1.5 : 1.0;
        const boost = (1.0 + bass * 0.5) * speakingBoost;
        const speed = 4.0 * boost; // Faster speed for tighter stream
        
        // Size scale: Smaller default (0.15), larger when speaking (0.5) - Thinner as requested
        const baseSizeScale = (isSpeaking ? 0.5 : 0.15) * this.fighterScale;
        
        for(let n of nozzles) {
            // Emission Rate
            let count = Math.floor(dt / 0.002); 
            if (isSpeaking) count = Math.floor(count * 1.2);
            if (count > 10) count = 10;
            
            for(let i=0; i<count; i++) {
                // Layer 1: Core (White/Hot) - High energy, opaque, very tight
                // Emit backwards (-X)
                this.particles.push(this.getParticle(
                    n.x, n.y, n.z,
                    (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, (speed + Math.random()), // +Z (ADAPT)
                    0.25, '#FFFFFF',
                    baseSizeScale * 0.8,
                    1.0 // Opaque core
                ));
                // Layer 2: Mid (Cyan/Blue) - Semi-transparent, medium spread
                this.particles.push(this.getParticle(
                    n.x, n.y, n.z,
                    (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08, (speed * 0.9), // +Z (ADAPT)
                    0.35, '#00FFFF',
                    baseSizeScale,
                    0.5 // Semi-transparent
                ));
                // Layer 3: Outer (Dark Blue/Purple) - Highly transparent, wide cone start
                this.particles.push(this.getParticle(
                    n.x, n.y, n.z,
                    (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (speed * 0.7), // +Z (ADAPT)
                    0.45, '#4169E1',
                    baseSizeScale * 1.2,
                    0.2 // Very transparent edges
                ));
            }
        }

        // Update existing
        for(let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.update(dt);
            if(p.life <= 0) {
                this.returnParticle(p);
                this.particles.splice(i, 1);
            }
        }
    }

    /**
     * Render exhaust particles
     * @param {CanvasRenderingContext2D} ctx 
     * @param {Function} transformFn Coordinate transform function
     */
    render(ctx, transformFn) {
        ctx.save();
        // Use 'lighter' for additive blending to make core hot
        ctx.globalCompositeOperation = 'lighter';
        
        for(let p of this.particles) {
            const t = transformFn(p.x, p.y, p.z);
            if (!t) continue;
            // Alpha fades with life, modulated by baseAlpha (layer transparency)
            const lifeRatio = p.life / p.maxLife;
            const alpha = lifeRatio * p.baseAlpha;
            
            // Size grows slightly as it fades (expansion)
            const size = (t.p * 20) * (1 - lifeRatio * 0.2) * p.sizeScale;
            
            ctx.beginPath();
            ctx.arc(t.x, t.y, Math.max(0.5, size), 0, Math.PI*2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
        ctx.fill();
        }
        ctx.restore();
    }

    /**
     * Update exhaust system scale
     * @param {number} scale New fighter scale
     */
    setScale(scale) {
        this.fighterScale = scale;
    }
}


/* ===== MissileSystem (fighter/missile.js, verbatim) ===== */
/**
 * @fileoverview Missile System for Space Fighter
 * Implements interactive missile launch with physics and effects
 */

/**
 * Single Missile Entity
 */
class Missile {
    /**
     * @param {number} x Position X
     * @param {number} y Position Y
     * @param {number} z Position Z
     * @param {Object} velocity {x,y,z}
     * @param {string} callsign Speaker callsign
     */
    constructor(x, y, z, velocity, callsign) {
        // 1. Model Specs (Randomized)
        // Diameter: 0.3 - 0.6m
        this.diameter = 0.3 + Math.random() * 0.3;
        // Aspect Ratio: 3:1 to 5:1
        const ratio = 3 + Math.random() * 2;
        this.length = this.diameter * ratio; // 0.9m - 3.0m

        // 2. Physics State
        this.pos = { x, y, z };
        this.vel = { ...velocity }; // Copy vector
        this.acc = 8 + Math.random() * 4; // 8 - 12 m/s^2
        this.gravity = 0.5 + Math.random() * 0.3; // 0.5 - 0.8
        
        // 3. Info
        this.callsign = callsign;
        this.life = 10.0; // Safety timeout
        this.active = true;

        // 4. Trail System
        this.trail = [];
        this.trailTimer = 0;
        this.trailFadeTime = 0.5 + Math.random() * 0.5; // 0.5 - 1.0s
        
        // 5. Visuals
        this.colorBody = '#E0E0E0';
        this.colorHead = '#FF3333';
    }

    /**
     * Update missile physics and trail
     * @param {number} dt Delta time
     */
    update(dt) {
        if (!this.active) return;

        // --- Physics Simulation ---
        
        // 1. Acceleration (Propulsion) - Direction of current velocity
        const speed = Math.sqrt(this.vel.x**2 + this.vel.y**2 + this.vel.z**2);
        if (speed > 0) {
            const dir = { x: this.vel.x/speed, y: this.vel.y/speed, z: this.vel.z/speed };
            this.vel.x += dir.x * this.acc * dt;
            this.vel.y += dir.y * this.acc * dt;
            this.vel.z += dir.z * this.acc * dt;
        }

        // 2. Gravity (Parabolic Trajectory)
        // Assuming +Y is "down" in the visualizer 3D space (screen coordinate system)
        this.vel.y += this.gravity * 9.8 * dt;

        // 3. Position Update
        this.pos.x += this.vel.x * dt;
        this.pos.y += this.vel.y * dt;
        this.pos.z += this.vel.z * dt;

        // 4. Lifecycle
        this.life -= dt;
        if (this.life <= 0 || this.pos.y > 100) { // Off screen (bottom)
            this.active = false;
        }

        // --- Trail System ---
        
        // Emission
        this.trailTimer += dt;
        // Density: 50-100 particles/sec
        const emissionRate = 50 + Math.random() * 50;
        const interval = 1 / emissionRate;
        
        while (this.trailTimer > interval) {
            this.trailTimer -= interval;
            this.addTrailParticle(speed);
        }

        // Update Particles
        for (let i = this.trail.length - 1; i >= 0; i--) {
            const p = this.trail[i];
            p.life -= dt;
            if (p.life <= 0) {
                this.trail.splice(i, 1);
            }
        }
    }

    /**
     * Add a single trail particle
     * @param {number} missileSpeed Current speed for length scaling
     */
    addTrailParticle(missileSpeed) {
        // Tail position (approximate, opposite to velocity)
        // Simply use current pos for "exhaust" point
        this.trail.push({
            x: this.pos.x + (Math.random()-0.5)*0.1,
            y: this.pos.y + (Math.random()-0.5)*0.1,
            z: this.pos.z + (Math.random()-0.5)*0.1,
            life: this.trailFadeTime,
            maxLife: this.trailFadeTime,
            size: this.diameter * (0.8 + Math.random() * 0.4), // Random size around nozzle size
            // Initial velocity for trail (slight spread)
            vx: (Math.random()-0.5) * 1.0,
            vy: (Math.random()-0.5) * 1.0,
            vz: (Math.random()-0.5) * 1.0
        });
    }

    /**
     * Render the missile
     * @param {CanvasRenderingContext2D} ctx 
     * @param {Function} transformFn 3D Projection function
     */
    render(ctx, transformFn) {
        if (!this.active) return;

        // Project Position
        const t = transformFn(this.pos.x, this.pos.y, this.pos.z);
        if (!t || t.p <= 0) return; // Behind camera or invalid

        const scale = t.p * 20; // Base scale factor
        
        // LOD Check: Distance > 500m (Approximated by low perspective scale)
        // If t.p is very small, object is far. 
        // Let's say p=1 is close, p=0.01 is far.
        const isLOD = t.p < 0.05; // ~20x distance

        // --- 1. Draw Tail Flame ---
        this.renderTrail(ctx, transformFn, scale);

        // --- 2. Draw Missile Body ---
        this.renderBody(ctx, transformFn, t, scale, isLOD);

        // --- 3. Draw Subtitle ---
        if (!isLOD) {
            this.renderSubtitle(ctx, t, scale);
        }
    }

    renderTrail(ctx, transformFn, scale) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        
        for (const p of this.trail) {
            const pt = transformFn(p.x, p.y, p.z);
            if (!pt || pt.p <= 0) continue;

            const alpha = p.life / p.maxLife;
            // Size fades with life
            const pSize = (pt.p * 20) * p.size * alpha; 

            // Blue Gradient: RGB(0,100,255) -> RGB(100,200,255)
            const r = 100 * (1-alpha); // 0 -> 100
            const g = 100 + 100 * (1-alpha); // 100 -> 200
            const b = 255;

            ctx.fillStyle = `rgba(${Math.floor(r)},${Math.floor(g)},${b},${alpha})`;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, Math.max(0.5, pSize), 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }

    renderBody(ctx, transformFn, t, scale, isLOD) {
        // Calculate rotation based on velocity
        const nextPos = {
            x: this.pos.x + this.vel.x * 0.1,
            y: this.pos.y + this.vel.y * 0.1,
            z: this.pos.z + this.vel.z * 0.1
        };
        const nt = transformFn(nextPos.x, nextPos.y, nextPos.z);
        
        if (nt) {
            const angle = Math.atan2(nt.y - t.y, nt.x - t.x);
            const len = this.length * scale;
            const width = this.diameter * scale;

            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(angle);
            
            if (isLOD) {
                // Simplified Line
                ctx.strokeStyle = '#CCCCCC';
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(-len/2, 0);
                ctx.lineTo(len/2, 0);
                ctx.stroke();
            } else {
                // Cylinder Approximation
                ctx.fillStyle = this.colorBody;
                ctx.fillRect(-len/2, -width/2, len, width);
                
                // Warhead
                ctx.fillStyle = this.colorHead;
                ctx.fillRect(len/2 - len*0.25, -width/2, len*0.25, width);
            }
            
            ctx.restore();
        }
    }

    renderSubtitle(ctx, t, scale) {
        if (!this.callsign) return;

        ctx.save();
        // Font size proportional to missile size
        const fontSize = Math.max(10, Math.floor(this.diameter * 20 * t.p * 2)); 
        ctx.font = `bold ${fontSize}px "Roboto Mono", monospace`;
        
        const text = this.callsign;
        const metrics = ctx.measureText(text);
        const padding = 4;
        const w = metrics.width + padding * 2;
        const h = fontSize + padding * 2;
        
        // Position: Above missile
        const x = t.x;
        const y = t.y - (20 * scale) - h/2;

        // Semi-transparent background
        ctx.fillStyle = 'rgba(0, 20, 40, 0.7)';
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.5)';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(x - w/2, y - h/2, w, h, 4);
        } else {
            ctx.rect(x - w/2, y - h/2, w, h);
        }
        ctx.fill();
        ctx.stroke();

        // Text
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y);

        ctx.restore();
    }
}

/**
 * Manager for Missile System
 */
class MissileSystem {
    constructor() {
        this.missiles = [];
        this.maxMissiles = 20;
    }

    /**
     * Trigger a new missile launch
     * @param {Object} origin {x,y,z}
     * @param {Object} velocity {x,y,z} Initial velocity vector
     * @param {string} callsign 
     */
    launch(origin, velocity, callsign) {
        if (this.missiles.length >= this.maxMissiles) {
            this.missiles.shift();
        }
        const vel = { ...velocity };
        // Add slight spread
        vel.x += (Math.random() - 0.5) * 0.5; // Speed variation
        vel.y += (Math.random() - 0.5) * 0.5; // Pitch spread
        vel.z += (Math.random() - 0.5) * 0.5; // Yaw spread
        
        this.missiles.push(new Missile(origin.x, origin.y, origin.z, vel, callsign));
    }

    /**
     * Update all missiles
     * @param {number} dt 
     */
    update(dt) {
        for (let i = this.missiles.length - 1; i >= 0; i--) {
            const m = this.missiles[i];
            m.update(dt);
            if (!m.active) {
                this.missiles.splice(i, 1);
            }
        }
    }

    /**
     * Render all missiles
     * @param {CanvasRenderingContext2D} ctx 
     * @param {Function} transformFn 
     */
    render(ctx, transformFn) {
        for (const m of this.missiles) {
            m.render(ctx, transformFn);
        }
    }
}


/* ===== RadarPanel (fighter/radar.js, verbatim) ===== */
/**
 * @fileoverview Sci-Fi Radar Panel UI
 */

class RadarPanel {
    constructor() {
        this.angle = 0;
        this.blips = [];
        this.lastUpdate = 0;
        
        // Initialize random blips with Linear Movement
        for(let i=0; i<3; i++) {
            this.blips.push(this.createBlip());
        }
    }

    createBlip() {
        // Position normalized (-1 to 1)
        return {
            x: (Math.random() - 0.5) * 1.6, 
            y: (Math.random() - 0.5) * 1.6,
            // Linear velocity
            vx: (Math.random() - 0.5) * 0.2, // Moderate speed
            vy: (Math.random() - 0.5) * 0.2,
            size: 2 + Math.random() * 3,
            pulse: Math.random() * Math.PI * 2
        };
    }

    /**
     * Update radar state
     * @param {number} dt 
     */
    update(dt) {
        this.angle += 2.0 * dt; // Scan line speed
        if (this.angle > Math.PI * 2) this.angle -= Math.PI * 2;
        
        this.blips.forEach(b => {
            b.pulse += dt * 5; // Faster pulse
            
            // Linear Movement
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            
            // Boundary check (Respawn if out of "range")
            if (b.x*b.x + b.y*b.y > 1.2) { // Circle radius ~1.1
                const newBlip = this.createBlip();
                Object.assign(b, newBlip);
            }
        });
    }

    /**
     * Render Radar Panel
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} w Canvas width
     * @param {number} h Canvas height
     * @param {Array} squadron List of fighters
     * @param {string} selfId ID of the current view/main fighter (to exclude)
     */
    render(ctx, w, h, squadron, selfId) {
        // Rectangular Panel Dimensions
        const panelH = Math.min(w, h) * 0.25; // 25% of min dimension height
        const panelW = panelH * 1.5; // Aspect Ratio 1.5:1 (Rectangular)
        
        const x = w - panelW - 20; // Right margin
        const y = h - panelH - 20; // Bottom margin
        const cx = x + panelW/2;
        const cy = y + panelH/2;
        
        // Radar Scan Radius (cover the rectangle corners)
        const r = Math.sqrt(panelW*panelW/4 + panelH*panelH/4);
        
        ctx.save();
        
        // 1. Panel Background (Glassy/Holographic)
        ctx.fillStyle = 'rgba(0, 20, 40, 0.5)';
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;
        
        // Rectangular Frame with Chamfered Corners
        ctx.beginPath();
        const corner = 15;
        ctx.moveTo(x + corner, y);
        ctx.lineTo(x + panelW - corner, y);
        ctx.lineTo(x + panelW, y + corner);
        ctx.lineTo(x + panelW, y + panelH - corner);
        ctx.lineTo(x + panelW - corner, y + panelH);
        ctx.lineTo(x + corner, y + panelH);
        ctx.lineTo(x, y + panelH - corner);
        ctx.lineTo(x, y + corner);
        ctx.closePath();
        
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fill();
        
        // Clip content to this rectangle
        ctx.clip();
        
        // Inner Grid (Rectangular + Circular Arcs)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
        ctx.lineWidth = 1;
        
        // Crosshair
        ctx.moveTo(cx - panelW/2, cy); ctx.lineTo(cx + panelW/2, cy);
        ctx.moveTo(cx, cy - panelH/2); ctx.lineTo(cx, cy + panelH/2);
        
        // Range Rings (Clipped by rect)
        ctx.arc(cx, cy, panelH * 0.3, 0, Math.PI * 2);
        ctx.moveTo(cx + panelH * 0.6, cy); // Move to next ring start to avoid connection line
        ctx.arc(cx, cy, panelH * 0.6, 0, Math.PI * 2);
        ctx.stroke();

        // 2. Scan Line (Rotating Sweep)
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, this.angle - 0.3, this.angle);
        ctx.lineTo(cx, cy);
        const scanGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        scanGrad.addColorStop(0, 'rgba(0, 243, 255, 0.0)');
        scanGrad.addColorStop(1, 'rgba(0, 243, 255, 0.2)');
        ctx.fillStyle = scanGrad;
        ctx.fill();
        
        // Scan Line Edge
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(this.angle) * r, cy + Math.sin(this.angle) * r);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 3. Random Blips (Simulation) - Linear Movement
        this.blips.forEach(b => {
            // Map normalized pos to screen
            // Use panelH/2 as scale reference (keep aspect ratio of space correct)
            const scale = panelH * 0.4; 
            const bx = cx + b.x * scale;
            const by = cy + b.y * scale;
            
            let alpha = 0.5 + Math.sin(b.pulse) * 0.5;
            
            ctx.beginPath();
            ctx.arc(bx, by, b.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, 50, 50, ${alpha})`;
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Tail trail (Velocity vector)
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx - b.vx * 200, by - b.vy * 200); // Inverse velocity trail
            ctx.strokeStyle = `rgba(255, 50, 50, ${alpha * 0.5})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        // 4. Nearest Targets (Real Data)
        if (squadron && squadron.length > 0) {
            // Find nearest
            const targets = squadron
                .filter(f => f.id !== selfId)
                .map(f => ({
                    id: f.id,
                    dist: Math.sqrt(f.pos.x*f.pos.x + f.pos.y*f.pos.y + f.pos.z*f.pos.z), // Dist from origin
                    z: f.pos.z
                }))
                .sort((a, b) => a.dist - b.dist)
                .slice(0, 3);
            
            // Display List (Overlay on top-left of radar)
            const listX = x + 10;
            const listY = y + 20;
            
            ctx.font = '10px "Courier New", monospace';
            ctx.textAlign = 'left';
            
            targets.forEach((t, i) => {
                const rowY = listY + i * 15;
                const alpha = 1.0 - i * 0.2;
                
                // Glowing Text
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 4;
                ctx.fillStyle = `rgba(0, 243, 255, ${alpha})`;
                ctx.fillText(`TRG-${i+1}: ${t.id}`, listX, rowY);
                
                // Distance bar
                const barW = 30 * (10 / (t.dist || 1));
                ctx.fillRect(listX + 80, rowY - 6, Math.min(40, barW), 4);
                
                ctx.shadowBlur = 0;
            });
        }
        
        ctx.restore();

        // 5. Memory Monitor (Overlay)
        this.drawMemoryStats(ctx, w, h);
    }

    drawMemoryStats(ctx, w, h) {
        // Chrome/Chromium only
        if (window.performance && window.performance.memory) {
            const mem = window.performance.memory;
            const used = Math.round(mem.usedJSHeapSize / 1048576); // MB
            const total = Math.round(mem.totalJSHeapSize / 1048576);
            
            ctx.save();
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            
            // Alarm Logic: > 100MB (Mobile Optimization Target)
            const isCritical = used > 100; 
            
            const text = `MEM: ${used} / ${total} MB`;
            const x = w - 20; // Align with Radar right margin
            const y = h - Math.min(w, h) * 0.25 - 40; // Above Radar
            
            // Background Box
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x - textWidth - 10, y - 5, textWidth + 20, 20);
            
            if (isCritical) {
                ctx.fillStyle = '#ff0000';
                // Blink effect
                if (Math.floor(Date.now() / 500) % 2 === 0) { 
                    ctx.fillText('⚠ MEMORY HIGH ⚠', x, y - 15);
                }
            } else {
                ctx.fillStyle = '#00ff00';
            }
            
            ctx.fillText(text, x, y);
            ctx.restore();
        }
    }
}

/**
 * @fileoverview Weapon System for Space Fighters
 */

/**
 * Manages weapons and hardpoints
 */
class WeaponSystem {
    constructor() {
        this.hardpoints = []; // {x, y, z, type, weapon}
        this.weapons = []; // Meshes
    }

    /**
     * Add a hardpoint to the system
     * @param {number} x 
     * @param {number} y 
     * @param {number} z 
     * @param {string} type 
     * @param {string} side 'L' or 'R'
     */
    addHardpoint(x, y, z, type, side) {
        this.hardpoints.push({x, y, z, type, side, weapon: null});
    }

    /**
     * Procedurally generate a weapon loadout
     * @param {number} seed 
     */
    generateLoadout(seed) {
        // Symmetric Loadout
        // Filter hardpoints by side 'L'
        const leftPoints = this.hardpoints.filter(h => h.side === 'L');
        
        leftPoints.forEach(hp => {
            let weaponType = null;
            // Random chance to mount weapon
            if (Math.random() > 0.2) { 
                if (hp.type === 'TIP') weaponType = 'AAM-S'; // Short range AAM
                else if (hp.type === 'WING') weaponType = Math.random() > 0.5 ? 'AAM-M' : 'AGM'; 
                else if (hp.type === 'BODY') weaponType = 'TANK';
            }

            if (weaponType) {
                // Mount on Left
                this.mountWeapon(hp, weaponType);
                
                // Mount on Right (Symmetry)
                const rightHp = this.hardpoints.find(h => h.side === 'R' && Math.abs(h.x + hp.x) < 0.01 && h.type === hp.type);
                if (rightHp) this.mountWeapon(rightHp, weaponType);
            }
        });
    }

    /**
     * Mount a specific weapon to a hardpoint
     * @param {Object} hp Hardpoint object
     * @param {string} type Weapon type
     */
    mountWeapon(hp, type) {
        // Generate simple mesh for weapon
        let mesh = { vertices: [], faces: [], color: '#FFF' };
        
        if (type === 'AAM-S') {
            // Sidewinder style: Thin, long
            mesh = this.createMissileMesh(0.1, 1.2, '#DDDDDD', '#FF0000');
        } else if (type === 'AAM-M') {
            // AMRAAM style: Medium
            mesh = this.createMissileMesh(0.15, 1.5, '#CCCCCC', '#FFFFFF');
        } else if (type === 'AGM') {
            // Maverick style: Thick
            mesh = this.createMissileMesh(0.25, 1.2, '#555555', '#FFFF00');
        } else if (type === 'TANK') {
            // Fuel Tank
            mesh = this.createTankMesh(0.3, 2.0, '#AAAAAA');
        }

        hp.weapon = mesh;
    }

    createMissileMesh(radius, len, bodyColor, finColor) {
        // Simple diamond shape to save perf
        return {
            vertices: [
                {x:0, y:0, z:-len/2}, // Nose
                {x:0, y:-radius, z:0}, // Top
                {x:-radius, y:radius, z:0}, // Left
                {x:radius, y:radius, z:0}, // Right
                {x:0, y:0, z:len/2} // Tail
            ],
            faces: [
                {idx:[0,1,2], color:bodyColor}, {idx:[0,2,3], color:bodyColor}, {idx:[0,3,1], color:bodyColor},
                {idx:[4,2,1], color:bodyColor}, {idx:[4,3,2], color:bodyColor}, {idx:[4,1,3], color:bodyColor}
            ]
        };
    }

    createTankMesh(radius, len, color) {
        // Elongated diamond
         return {
            vertices: [
                {x:0, y:0, z:-len/2}, 
                {x:0, y:-radius, z:0}, 
                {x:-radius, y:0, z:0}, 
                {x:radius, y:0, z:0}, 
                {x:0, y:radius, z:0},
                {x:0, y:0, z:len/2}
            ],
            faces: [
                {idx:[0,1,2], color}, {idx:[0,2,3], color}, {idx:[0,3,4], color}, {idx:[0,4,1], color},
                {idx:[5,2,1], color}, {idx:[5,3,2], color}, {idx:[5,4,3], color}, {idx:[5,1,4], color}
            ]
        };
    }
}

/**
 * @fileoverview Space Fighter Model Class
 */


/**
 * Procedurally generated Space Fighter
 */
class SpaceFighter {
    /**
     * @param {number} seed Random seed (0-1)
     * @param {Object} pos Initial position {x, y, z}
     */
    constructor(seed = Math.random(), pos = {x:0, y:0, z:0}) {
        this.seed = seed;
        this.pos = pos;
        this.id = 'XV-' + String(Math.floor(this.seed * 900 + 100)).padStart(3, '0');
        this._scale = 1.0;
        this.exhaust = new ExhaustSystem(this._scale);
        this.weapons = new WeaponSystem();
        this.radar = new RadarPanel();
        
        // Randomize Palette
        this.palette = this.generatePalette();
        
        // Generate Hull (Geometry + Topology)
        this.model = this.generateHull();
        
        // Setup Hardpoints
        this.setupHardpoints();
        
        // Randomize Loadout
        this.weapons.generateLoadout(this.seed);
        
        // Dynamics
        this.recoilPitch = 0; // Radians
        this.targetRecoil = 0;

        // Render Cache to reduce GC
        this.cache = {
            transformedVerts: [],
            renderList: []
        };
        
        // Launch Queue for delay/safety
        this.launchQueue = [];
    }

    /**
     * Get/Set scale and sync with components
     */
    get scale() { return this._scale; }
    set scale(v) {
        this._scale = v;
        if (this.exhaust) this.exhaust.setScale(v);
    }

    /**
     * Trigger missile launch
     * @param {MissileSystem} missileSystem 
     * @param {string} callsign 
     */
    triggerLaunch(missileSystem, callsign) {
        // Schedule launch with slight random delay (50-200ms) for realism
        // and to allow bay doors to open (conceptually)
        const delay = 0.05 + Math.random() * 0.15;
        this.launchQueue.push({
            timer: delay,
            callsign: callsign,
            system: missileSystem
        });
    }

    /**
     * Process pending launches
     * @param {number} dt 
     */
    updateLaunchQueue(dt) {
        for (let i = this.launchQueue.length - 1; i >= 0; i--) {
            const task = this.launchQueue[i];
            task.timer -= dt;
            
            if (task.timer <= 0) {
                this.executeLaunch(task.system, task.callsign);
                this.launchQueue.splice(i, 1);
            }
        }
    }

    /**
     * Execute actual launch logic
     */
    executeLaunch(missileSystem, callsign) {
        // 1. Select Hardpoint (Left or Right Wing)
        // Northstar Fighter Hardpoint Estimates (Local Space)
        // Forward is +X, Wings are on Z axis
        // Wingtip hardpoints, hull frame (forward -Z, wings span X) (ADAPT)
        const side = Math.random() > 0.5 ? 1 : -1;
        const wingSpan = 3.5 + (this.seed * 1.0);
        const hp = { x: wingSpan * side, y: 0.2, z: 1.2 };

        // 2. Calculate Rotation (Recoil/Pitch)
        // Rotate hardpoint offset around Z axis (Pitch for X-Forward)
        // Pitch Up (+Recoil) -> Nose Up (+Y)
        let cosR = 1, sinR = 0;
        if (this.recoilPitch) { // Use current recoil or 0
             cosR = Math.cos(this.recoilPitch);
             sinR = Math.sin(this.recoilPitch);
        }

        // Rotated Offset
        // x' = x*cos - y*sin
        // y' = x*sin + y*cos
        // z' = z
        const rx = hp.x;
        const ry = hp.y * cosR - hp.z * sinR;
        const rz = hp.y * sinR + hp.z * cosR; // rotate y/z about X (ADAPT)

        // 3. Calculate World Position (Origin)
        // Apply Scale + Fighter Position
        // Add Safety Drop (-Y) and Forward Offset (+X) to clear wing
        const safetyDrop = -0.5 * this.scale; 
        const forwardOffset = -1.0 * this.scale; // Move forward (-Z) to clear pylon (ADAPT)

        const origin = {
            x: this.pos.x + rx * this.scale,
            y: this.pos.y + ry * this.scale + safetyDrop,
            z: this.pos.z + rz * this.scale + forwardOffset
        };

        // 4. Calculate Velocity Vector
        // Base Direction: Forward (+X) rotated by Pitch
        // dir = { cos, sin, 0 }
        const dir = {
            x: 0,
            y: sinR,
            z: -cosR
        }; // forward is -Z in hull frame (ADAPT)

        // Speeds (m/s approx)
        const fighterSpeed = 50.0; // Simulated forward speed of fighter
        const ejectionSpeed = 20.0; // Initial kick from pylon
        const baseSpeed = fighterSpeed + ejectionSpeed;

        // Velocity Vector
        const velocity = {
            x: dir.x * baseSpeed,
            y: dir.y * baseSpeed,
            z: dir.z * baseSpeed
        };
        
        // Add Ejection Drop (Gravity assist / Pylon push down)
        velocity.y -= 5.0; 

        // 5. Fire
        missileSystem.launch(origin, velocity, callsign);

        // 6. Apply Recoil to Fighter
        this.recoilPitch = 0.05 + Math.random() * 0.03; 
    }

    /**
     * Generate color palette based on seed
     * @returns {Object} Palette object
     */
    generatePalette() {
        const schemes = FIGHTER_PALETTES;
        const base = schemes[Math.floor(this.seed * schemes.length)];
        return {
            ...base,
            WING_EDGE: '#FFFFFF',
            COCKPIT: '#FFFFFF',
            ENGINE_IN: '#4B0082'
        };
    }

    /**
     * Generate procedural hull geometry
     * Industry Standard Topology:
     * - Consistent CCW Winding for Backface Culling
     * - Shared Vertices
     * - Pre-calculated Normals for Lighting
     * @returns {Object} {vertices, faces}
     */
    generateHull() {
        const v = [];
        const p = this.palette;
        const faces = [];

        // Helper to add vertex
        const addV = (x, y, z) => v.push({x, y, z}) - 1;

        // --- VERTICES ---

        // 0. Nose Tip
        const vNose = addV(0, 0, -3.5);

        // 1. Cockpit Ring (z = -1.0) - Diamond Shape
        // Looking from Front (-Z) to Back (+Z), CCW: Top -> Left -> Bottom -> Right ??
        // Standard CCW Winding usually means: V0, V1, V2.
        // If we look at the face from OUTSIDE, vertices are ordered CCW.
        const vCockpitTop = addV(0, -0.4, -1.0);
        const vCockpitRight = addV(0.5, 0.1, -1.0);
        const vCockpitBottom = addV(0, 0.3, -1.0);
        const vCockpitLeft = addV(-0.5, 0.1, -1.0);

        // 2. Fuselage Main (z = 0.5)
        const vFuseTop = addV(0, -0.5, 0.5);
        const vFuseRight = addV(0.7, 0.1, 0.5);
        const vFuseBottom = addV(0, 0.4, 0.5);
        const vFuseLeft = addV(-0.7, 0.1, 0.5);

        // 3. Rear Body Start (z = 1.5)
        const vRearTop = addV(0, -0.5, 1.5);
        const vRearRight = addV(0.7, 0.1, 1.5);
        const vRearBottom = addV(0, 0.4, 1.5);
        const vRearLeft = addV(-0.7, 0.1, 1.5);

        // 4. Exhaust Nozzle Ring (z = 2.4) - 8-Sided Cone
        // Transition from 4-sided body to 8-sided nozzle
        const nozzleZ = 2.4;
        const nozzleRad = 0.35;
        const nozzleIndices = [];
        for(let i=0; i<8; i++) {
            const angle = (i / 8) * Math.PI * 2 - Math.PI / 2; // Start from Top (-Y)
            nozzleIndices.push(addV(
                Math.cos(angle) * nozzleRad,
                Math.sin(angle) * nozzleRad,
                nozzleZ
            ));
        }
        // nozzleIndices: [Top, Top-Right, Right, Bottom-Right, Bottom, Bottom-Left, Left, Top-Left]
        // Actually: 
        // i=0 (-PI/2) -> sin=-1 (y=-R, Top), cos=0 (x=0)
        // i=1 (-PI/4) -> sin=-0.7, cos=0.7 (Top-Right)
        // i=2 (0) -> sin=0, cos=1 (Right)
        // ...

        // 5. Wings (Swept)
        const wingSpan = 3.5 + (this.seed * 1.0);
        const vWingLeft = addV(-wingSpan, 0.1, 1.0);
        const vWingRight = addV(wingSpan, 0.1, 1.0);

        // 6. Tails (Twin Vertical Stabilizers)
        const vTailLeftTip = addV(-1.2, -1.8, 2.0);
        const vTailRightTip = addV(1.2, -1.8, 2.0);

        // 7. Exhaust Center (Virtual, for particles)
        const vExhaustCenter = addV(0, 0, 2.4);

        // --- FACES ---
        // Helper to add face with auto-normal
        const addFace = (indices, color) => {
            // Calculate Normal
            const p0 = v[indices[0]];
            const p1 = v[indices[1]];
            const p2 = v[indices[2]];
            
            // Vector A: p1 - p0
            const ax = p1.x - p0.x, ay = p1.y - p0.y, az = p1.z - p0.z;
            // Vector B: p2 - p0
            const bx = p2.x - p0.x, by = p2.y - p0.y, bz = p2.z - p0.z;
            
            // Cross Product (A x B)
            let nx = ay * bz - az * by;
            let ny = az * bx - ax * bz;
            let nz = ax * by - ay * bx;
            
            // Normalize
            const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
            if (len > 0) { nx /= len; ny /= len; nz /= len; }
            
            faces.push({
                idx: indices,
                color: color,
                normal: {x: nx, y: ny, z: nz}
            });
        };

        // Note: CCW Winding Order
        // Front Nose
        addFace([vNose, vCockpitBottom, vCockpitRight], p.HULL_DARK);
        addFace([vNose, vCockpitRight, vCockpitTop], p.HULL_LIGHT); // Top Right
        addFace([vNose, vCockpitTop, vCockpitLeft], p.HULL_LIGHT);  // Top Left
        addFace([vNose, vCockpitLeft, vCockpitBottom], p.HULL_DARK);

        // Cockpit -> Fuselage
        // Top
        addFace([vCockpitTop, vFuseRight, vCockpitRight], p.COCKPIT); 
        addFace([vCockpitTop, vFuseTop, vFuseRight], p.COCKPIT);
        addFace([vCockpitTop, vFuseLeft, vFuseTop], p.COCKPIT); // Top Left
        addFace([vCockpitTop, vCockpitLeft, vFuseLeft], p.COCKPIT);
        
        // Sides
        addFace([vCockpitRight, vFuseBottom, vCockpitBottom], p.HULL_DARK);
        addFace([vCockpitRight, vFuseRight, vFuseBottom], p.HULL_DARK);
        
        addFace([vCockpitLeft, vCockpitBottom, vFuseBottom], p.HULL_DARK);
        addFace([vCockpitLeft, vFuseBottom, vFuseLeft], p.HULL_LIGHT); // Left Side

        // Bottom
        addFace([vCockpitBottom, vFuseBottom, vCockpitBottom], p.HULL_DARK); // Wait, this is degenerate?
        // Let's re-check connectivity.
        // Cockpit Bottom (v3) -> Fuselage Bottom (v7)
        // Correct is:
        addFace([vCockpitBottom, vFuseBottom, vFuseRight], p.HULL_DARK); // Needs triangulation?
        // Already covered sides above.
        // Bottom Face: vCockpitBottom(v3), vFuseBottom(v7).
        // It's a quad v3-v2-v6-v7 (Bottom Right Side) and v3-v4-v8-v7 (Bottom Left Side).
        
        // Let's simplify Fuselage Faces (Quad -> 2 Tris)
        
        // Rear Body (Fuselage -> Rear)
        // Top
        addFace([vFuseTop, vFuseLeft, vRearLeft], p.HULL_MID);
        addFace([vFuseTop, vRearLeft, vRearTop], p.HULL_MID);
        addFace([vFuseTop, vRearTop, vRearRight], p.HULL_MID);
        addFace([vFuseTop, vRearRight, vFuseRight], p.HULL_MID);
        
        // Bottom
        addFace([vFuseBottom, vRearRight, vRearBottom], p.HULL_DARK);
        addFace([vFuseBottom, vFuseRight, vRearRight], p.HULL_DARK);
        addFace([vFuseBottom, vRearBottom, vRearLeft], p.HULL_DARK);
        addFace([vFuseBottom, vRearLeft, vFuseLeft], p.HULL_DARK);
        
        // Sides
        addFace([vFuseRight, vRearRight, vRearTop], p.HULL_DARK); // Wait, Top is covered. Side is Right-Bottom.
        // Actually, just stitch the rings.
        
        // EXHAUST CONE (Transition 4 -> 8)
        // Rear Ring: Top(v9), Right(v10), Bottom(v11), Left(v12)
        // Nozzle Ring: 0(Top), 1, 2(Right), 3, 4(Bottom), 5, 6(Left), 7
        
        // Top Quadrant
        addFace([vRearTop, nozzleIndices[1], nozzleIndices[0]], p.HULL_MID);
        addFace([vRearTop, vRearRight, nozzleIndices[1]], p.HULL_MID); // Triangle + Triangle?
        // Let's connect vRearTop to Nozzle[0], Nozzle[1], Nozzle[7]
        addFace([vRearTop, nozzleIndices[7], nozzleIndices[0]], p.HULL_MID);
        addFace([vRearTop, nozzleIndices[0], nozzleIndices[1]], p.HULL_MID);
        
        // Right Quadrant (vRearRight to Nozzle[1, 2, 3])
        addFace([vRearRight, nozzleIndices[1], nozzleIndices[2]], p.HULL_DARK);
        addFace([vRearRight, nozzleIndices[2], nozzleIndices[3]], p.HULL_DARK);
        
        // Bottom Quadrant (vRearBottom to Nozzle[3, 4, 5])
        addFace([vRearBottom, nozzleIndices[3], nozzleIndices[4]], p.HULL_DARK);
        addFace([vRearBottom, nozzleIndices[4], nozzleIndices[5]], p.HULL_DARK);
        
        // Left Quadrant (vRearLeft to Nozzle[5, 6, 7])
        addFace([vRearLeft, nozzleIndices[5], nozzleIndices[6]], p.HULL_MID);
        addFace([vRearLeft, nozzleIndices[6], nozzleIndices[7]], p.HULL_MID);
        
        // Fill Gaps between quadrants
        // Top-Right Corner
        addFace([vRearTop, vRearRight, nozzleIndices[1]], p.HULL_MID);
        // Right-Bottom Corner
        addFace([vRearRight, vRearBottom, nozzleIndices[3]], p.HULL_DARK);
        // Bottom-Left Corner
        addFace([vRearBottom, vRearLeft, nozzleIndices[5]], p.HULL_DARK);
        // Left-Top Corner
        addFace([vRearLeft, vRearTop, nozzleIndices[7]], p.HULL_MID);
        
        // WINGS
        // Left
        addFace([vWingLeft, vFuseLeft, vRearLeft], p.HULL_LIGHT); // Top
        addFace([vWingLeft, vRearLeft, vFuseLeft], p.HULL_DARK);  // Bottom (Reverse Winding)
        
        // Right
        addFace([vWingRight, vRearRight, vFuseRight], p.HULL_LIGHT); // Top
        addFace([vWingRight, vFuseRight, vRearRight], p.HULL_DARK);  // Bottom
        
        // TAILS
        // Left
        addFace([vTailLeftTip, vRearTop, vRearLeft], p.HULL_LIGHT); // Outer
        addFace([vTailLeftTip, vRearLeft, vRearTop], p.HULL_LIGHT); // Inner
        
        // Right
        addFace([vTailRightTip, vRearRight, vRearTop], p.HULL_LIGHT); // Outer
        addFace([vTailRightTip, vRearTop, vRearRight], p.HULL_LIGHT); // Inner

        // EXHAUST INTERIOR (Cap)
        // 8-fan
        for(let i=0; i<8; i++) {
            const next = (i+1)%8;
            addFace([vExhaustCenter, nozzleIndices[next], nozzleIndices[i]], p.ENGINE_IN);
        }

        return { vertices: v, faces: faces };
    }

    /**
     * Setup weapon hardpoints on the hull
     */
    setupHardpoints() {
        // Approximate hardpoints based on known vertex indices
        // Right Wing Tip (v18 in old, now vWingRight)
        // We can't rely on indices easily unless we stored them.
        // But we know geometry.
        
        const wingSpan = 3.5 + (this.seed * 1.0);
        
        // Wing Tips
        this.weapons.addHardpoint(wingSpan, 0.2, 1.2, 'TIP', 'R');
        this.weapons.addHardpoint(-wingSpan, 0.2, 1.2, 'TIP', 'L');
        
        // Under Wing
        this.weapons.addHardpoint(wingSpan * 0.5, 0.3, 1.2, 'WING', 'R');
        this.weapons.addHardpoint(-wingSpan * 0.5, 0.3, 1.2, 'WING', 'L');
    }

    /**
     * Update fighter state
     */
    update(dt, bass, isSpeaking = false) {
        // Process Launch Queue
        this.updateLaunchQueue(dt);

        // Engine Nozzles (World Space) - Adjusted for GLB Model
        // Northstar Fighter: Engine is central, slightly elevated, at the back
        // Forward is +X, so Back is -X
        // User Request: "z coordinate up a bit" (Likely means Y-up in 3D space, or visual Z)
        // Adjusting Y (Vertical) to 0.25 (was 0.15)
        const nozzleOffset = { x: 0, y: 0.25, z: 2.4 }; // ADAPT: hull frame, tail is +Z 
        
        // Apply Recoil Rotation to Offset
        // Rotate around Z axis (Pitch)
        let cosR = 1, sinR = 0;
        if (this.recoilPitch > 0) {
            cosR = Math.cos(this.recoilPitch);
            sinR = Math.sin(this.recoilPitch);
        }
        
        // y' = y*cos - z*sin (rotate about X, hull pitch axis) (ADAPT)
        // z' = y*sin + z*cos
        const nx = nozzleOffset.x;
        const ny = nozzleOffset.y * cosR - nozzleOffset.z * sinR;
        const nz = nozzleOffset.y * sinR + nozzleOffset.z * cosR;
        
        // Calculate Nozzle Position with Scale
        const nozzles = [
            { 
                x: this.pos.x + nx * this.scale, 
                y: this.pos.y + ny * this.scale, 
                z: this.pos.z + nz * this.scale 
            }
        ];
        
        this.exhaust.update(dt, nozzles, bass, isSpeaking);
        this.radar.update(dt);
        
        this.recoilPitch *= 0.9;
        if (this.recoilPitch < 0.001) this.recoilPitch = 0;
    }

    /**
     * Render fighter effects (Exhaust, Labels, etc.) without the hull
     * Used when 3D rendering is handled by Three.js
     */
    drawEffects(ctx, transformFn, bass) {
        // Draw Exhaust
        this.exhaust.render(ctx, transformFn);

        // Markings (ID) - Scale-aware positioning
        // Placed ABOVE the fighter
        const labelPos = transformFn(
            this.pos.x + 0.5 * this.scale, 
            this.pos.y + 1.5 * this.scale, 
            this.pos.z - 0.5 * this.scale
        );
        
        // Check if visible (in front of camera)
        if (labelPos.visible !== false) {
             ctx.fillStyle = this.palette.GLOW;
             ctx.shadowBlur = 0;
             // Use p for scaling if available, otherwise default
             const scale = labelPos.p || 1.0;
             ctx.font = `bold ${Math.max(8, Math.floor(12 * scale))}px monospace`;
             ctx.fillText(this.id, labelPos.x, labelPos.y);
        }
    }

    /**
     * Render the fighter with Dynamic Lighting and Backface Culling
     */
    render(ctx, transformFn, bass, squadron = [], showRadar = false) {
        // Lighting Setup (Directional Light from Top-Right-Front)
        // Normalized vector: {x: 0.5, y: -1.0, z: -0.5}
        const lightDir = {x: 0.4, y: -0.8, z: -0.4};
        const len = Math.sqrt(lightDir.x**2 + lightDir.y**2 + lightDir.z**2);
        lightDir.x /= len; lightDir.y /= len; lightDir.z /= len;

        // Recoil Matrix Pre-calculation
        let cosR = 1, sinR = 0;
        if (this.recoilPitch > 0) {
            cosR = Math.cos(this.recoilPitch);
            sinR = Math.sin(this.recoilPitch);
        }

        // 1. Transform All Vertices
        // Reuse cache arrays to avoid GC
        const tVerts = this.cache.transformedVerts;
        tVerts.length = 0; // Clear
        
        const verts = this.model.vertices;
        for(let i=0; i<verts.length; i++) {
            const v = verts[i];
            
            // Local Rotation (Recoil)
            let ly = v.y * cosR - v.z * sinR;
            let lz = v.y * sinR + v.z * cosR;
            let lx = v.x;

            // World Space (with scale)
            const wx = lx * this.scale + this.pos.x;
            const wy = ly * this.scale + this.pos.y;
            const wz = lz * this.scale + this.pos.z;

            // Screen Space
            tVerts.push(transformFn(wx, wy, wz));
        }

        // 2. Prepare Render List (Faces)
        const renderList = this.cache.renderList;
        renderList.length = 0;

        // Hull Faces
        const faces = this.model.faces;
        for(let i=0; i<faces.length; i++) {
            const f = faces[i];
            const v0 = tVerts[f.idx[0]];
            const v1 = tVerts[f.idx[1]];
            const v2 = tVerts[f.idx[2]];

            // Visibility Check (Clipping)
            if (v0.z < 0 || v1.z < 0 || v2.z < 0) continue; // Behind camera?
            // Actually transformFn returns x:-9999 if behind.

            // Backface Culling (2D Cross Product)
            // (x1-x0)(y2-y0) - (y1-y0)(x2-x0)
            // If < 0, it's facing away (assuming CCW winding and Y-down screen)
            // Wait, standard canvas Y is down.
            // CCW points: 
            // 0 -> 1 (dx1, dy1)
            // 0 -> 2 (dx2, dy2)
            // Cross = dx1*dy2 - dy1*dx2
            // If > 0, it's CW? If < 0 it's CCW?
            // Let's rely on standard logic: (x2-x0)*(y1-y0) - (x1-x0)*(y2-y0)
            const ax = v1.x - v0.x;
            const ay = v1.y - v0.y;
            const bx = v2.x - v0.x;
            const by = v2.y - v0.y;
            
            // Cross Z = ax*by - ay*bx
            const cross = ax * by - ay * bx;
            
            // If cross > 0, it's Clockwise (in Y-down system).
            // If our faces are CCW in 3D, they project to ... depends on transform.
            // Let's assume consistent winding and test. 
            // If faces disappear, flip the condition.
            // Using "Painter's Algo" + Culling is safest.
            if (cross < 0) continue; // Cull backfaces

            // Lighting (Dot Product of Normal and Light)
            // Rotate Normal by Recoil
            let nx = f.normal.x;
            let ny = f.normal.y * cosR - f.normal.z * sinR;
            let nz = f.normal.y * sinR + f.normal.z * cosR;
            
            // Dot Product (Face Normal . Light Direction)
            // Note: LightDir is pointing TO light? Or FROM light?
            // Usually LightDir is Direction TO Light source.
            // My lightDir is {0.4, -0.8, -0.4} -> Down-Left-Back?
            // Let's say Light is coming FROM Top-Right.
            // Vector TO Light = {-0.4, 0.8, 0.4}.
            // Diffuse = max(0, dot(N, L))
            
            // Let's just use a simple fake shading based on Normal Y/X
            // Or use the pre-calculated normal relative to a fixed vector
            const dot = nx * -lightDir.x + ny * -lightDir.y + nz * -lightDir.z;
            const intensity = Math.max(0.4, Math.min(1.0, 0.5 + dot * 0.5));
            
            // Calculate Average Z for sorting
            const avgZ = (v0.z + v1.z + v2.z) / 3;

            renderList.push({
                vs: [v0, v1, v2],
                color: f.color,
                intensity: intensity,
                z: avgZ
            });
        }

        // Weapon Faces (Simplified handling for now, or need to transform them too)
        // For performance, let's skip weapon sophisticated lighting for a moment 
        // or just add them to list.
        // Weapons have their own vertices.
        // ... (Weapon rendering omitted for brevity/optimization in this pass, 
        // can be added if needed, but 'Refactor' implies keeping functionality.
        // I should include them.)
        
        // Handling Weapons:
        this.weapons.hardpoints.forEach(hp => {
            if (!hp.weapon) return;
            const wMesh = hp.weapon;
            
            // We need to transform weapon verts.
            // Optimization: Cache this too if possible, but weapon moves with hardpoint.
            const wVerts = wMesh.vertices.map(v => {
                // Local -> HP -> World -> Screen (with scale)
                let lx = (hp.x + v.x) * this.scale;
                let ly = (hp.y + v.y) * this.scale;
                let lz = (hp.z + v.z) * this.scale;
                
                // Recoil Rotation
                let ry = ly * cosR - lz * sinR;
                let rz = ly * sinR + lz * cosR;
                
                const wx = lx + this.pos.x;
                const wy = ry + this.pos.y;
                const wz = rz + this.pos.z;
                return transformFn(wx, wy, wz);
            });

            wMesh.faces.forEach(f => {
                const v0 = wVerts[f.idx[0]];
                const v1 = wVerts[f.idx[1]];
                const v2 = wVerts[f.idx[2]];
                
                // Culling
                const ax = v1.x - v0.x, ay = v1.y - v0.y;
                const bx = v2.x - v0.x, by = v2.y - v0.y;
                if (ax * by - ay * bx < 0) return;

                // Simple Lighting for weapons (Flat or based on normal if available)
                // Weapons usually don't have pre-calc normals in this system yet.
                // Use default intensity.
                const avgZ = (v0.z + v1.z + v2.z) / 3;
                
                renderList.push({
                    vs: [v0, v1, v2],
                    color: '#888888', // Default weapon color
                    intensity: 0.8,
                    z: avgZ
                });
            });
        });

        // 3. Sort
        renderList.sort((a, b) => b.z - a.z); // Painter's: far (large depth) first (ADAPT)
        // Wait, standard OpenGL is -Z is forward.
        // My transformFn:
        // persp = dist / (dist - z);
        // z is World Z.
        // If z increases, it's further away?
        // +Z is Rear of plane.
        // Plane is at z=0.
        // Viewpoint is "Camera".
        // In `renderer.js`: `dist = 8; persp = dist / (dist - z);`
        // If z is positive (e.g. 5), persp = 8/3 = 2.6 (Large).
        // If z is negative (e.g. -5), persp = 8/13 = 0.6 (Small).
        // So +Z is CLOSER to camera (if camera is at +inf?).
        // Wait. `persp = dist / (dist - z)`.
        // As z approaches `dist` (8), persp -> infinity.
        // So Camera is at z = 8.
        // Objects at z=0 are at distance 8.
        // Objects at z=2 are at distance 6 (Closer).
        // So High Z = Close. Low Z = Far.
        // (ADAPT: the second sort here contradicted the one above; removed, depth-descending sort governs.)

        // 4. Draw
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineWidth = 1;
        
        // Global Shadow for "Glow" - Apply only once per batch if possible?
        // No, stroke needs it.
        ctx.shadowBlur = 10 + bass * 10;
        ctx.shadowColor = this.palette.GLOW;

        renderList.forEach(p => {
            const { vs, color, intensity } = p;
            
            ctx.beginPath();
            ctx.moveTo(vs[0].x, vs[0].y);
            ctx.lineTo(vs[1].x, vs[1].y);
            ctx.lineTo(vs[2].x, vs[2].y);
            ctx.closePath();

            // Apply Lighting to Color
            // Parse Hex color? Expensive.
            // Just use Global Alpha or specific HSL?
            // Let's use filter or overlay.
            // Or just simple opacity change? No, that reveals background.
            // Let's just use the base color for now, lighting is hard with Hex strings without parsing.
            // BUT user asked for "Dynamic Lighting".
            // I can use `ctx.globalAlpha = intensity`? No, transparent.
            // I can use `ctx.fillStyle` with HSL if I convert.
            // Let's assume color is Hex.
            // Quick Hack: Overlay black/white with alpha?
            
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            
            // Lighting Overlay
            // If intensity < 0.5 -> Darken. > 0.5 -> Lighten.
            // We can draw the shape, then draw a semi-transparent black/white on top.
            ctx.fill();
            ctx.stroke();
            
            if (intensity < 0.8) {
                ctx.fillStyle = `rgba(0,0,0,${1 - intensity})`;
                ctx.fill();
            } else if (intensity > 1.2) {
                ctx.fillStyle = `rgba(255,255,255,${intensity - 1.2})`;
                ctx.fill();
            }
        });

        // Markings (ID) - Scale-aware positioning
        const labelPos = transformFn(
            this.pos.x + 0.8 * this.scale, 
            this.pos.y - 0.6 * this.scale, 
            this.pos.z - 0.5 * this.scale
        );
        if (labelPos.p > 0.5) {
             ctx.fillStyle = this.palette.GLOW;
             ctx.shadowBlur = 0;
             ctx.font = `bold ${Math.max(8, Math.floor(12 * labelPos.p))}px monospace`;
             ctx.fillText(this.id, labelPos.x, labelPos.y);
        }

        ctx.restore();

        // Draw Exhaust
        this.exhaust.render(ctx, transformFn);

        // Render Radar
        if (showRadar && this.radar) {
            this.radar.render(ctx, ctx.canvas.width, ctx.canvas.height, squadron, this.id);
        }
    }

    /**
     * Update fighter scale and sync exhaust system
     * @param {number} scale New scale value (1.0 = normal)
     */
    setScale(scale) {
        this.scale = Math.max(0.1, Math.min(3.0, scale));
        // Update exhaust system scale
        if (this.exhaust) {
            this.exhaust.setScale(this.scale);
        }
    }
}


/* ===== FighterRenderer (adapted, see fighter-renderer-port.js) ===== */
/**
 * FighterRenderer（移植改编版）
 * 来源：仓库 www/js/modules/visualizer/renderers/fighter/renderer.js
 *   + fighter.js / exhaust.js / missile.js / radar.js / weapon.js / constants.js
 *   + core/base-renderer.js（BaseRenderer / drawTime）
 *
 * 改编原因（仓库原版无法直接装进 APK）：
 * 1. 仓库版 FighterRenderer 依赖 Three.js（import * as THREE from 'three'）
 *    + GLTFLoader/DRACOLoader + 联网下载 .glb 模型 + Draco 解码器 CDN，
 *    而 APK 是离线单文件页面，没有 three、没有模型文件、Draco 解码器还要联网；
 *    且仓库里那两个 import 路径本身就是断的（model-download-manager.js /
 *    model-config.js 实际在 www/js/modules/ 下，import 写的是 www/js/ 下），
 *    仓库原样根本跑不起来。
 * 2. 因此改用仓库里自带的纯 2D 软件光栅渲染器 SpaceFighter.render()
 *    （程序化船体 + 背面剔除 + 画家算法 + 动态光照 + 武器挂架 + 雷达），
 *    它只需要一个 transformFn(x,y,z) -> {x,y,p,visible,z}，不需要 Three.js。
 * 3. 背景粒子、导弹、尾焰、雷达均照搬仓库代码，仅做坐标系适配：
 *    程序化船体是船体坐标系（机头 -Z、机翼沿 X、上方 -Y），而仓库的
 *    update()/executeLaunch()/exhaust.js 是按 GLB 模型坐标系（机头 +X）写的，
 *    两者对不上。下面三处已按船体坐标系改过（见行内注释）：
 *    - SpaceFighter.update() 的尾喷口位置：(-2.0, 0.25, 0) -> (0, 0.25, 2.4)，
 *      后坐旋转轴由 Z 轴改为 X 轴；
 *    - ExhaustSystem.update() 的尾焰喷射方向：-X -> +Z（向机尾后方）；
 *    - SpaceFighter.executeLaunch() 的挂架/速度方向：机头 +X -> 机头 -Z，
 *      改为从真实翼尖挂架（weapons.hardpoints）取点发射。
 * 4. transformFn 的 z 字段定义为“到相机的距离（depth）”：相机后方为负，
 *    与 SpaceFighter.render() 里的 behind-camera 判断（z < 0 跳过）一致；
 *    画家排序改为按 depth 降序（远的先画）。仓库 render() 是死代码，
 *    里面的两处 sort 自相矛盾（先 b.z-a.z 又 a.z-b.z），此处以正确的为准。
 * 5. 不加载 .glb 模型，不用 WebGL canvas，不联网；旋转用拖拽（触摸/鼠标），
 *    由 Visualizer._bindPointer() 接入；滚轮缩放没有（手机无滚轮），
 *    缩放保持仓库默认（入场 zoom 3.0 -> 目标 0.75）。
 */
class FighterRenderer extends BaseRenderer {
    /**
     * @param {CanvasRenderingContext2D} ctx
     */
    constructor(ctx) {
        super(ctx);
        this.particles = [];
        this.initialized = false;

        // 3D 状态：与仓库 renderer.js 一致（机头朝右上倾斜 30 度）
        const rad30 = 30 * (Math.PI / 180);
        this.rotation = { x: rad30, y: rad30, z: 0 };
        this.targetRotation = { x: rad30, y: rad30, z: 0 };
        this.isDragging = false;
        this.lastMouse = { x: 0, y: 0 };

        // 缩放：与仓库一致（入场先放大再回到 0.75）
        this.zoom = 3.0;
        this.targetZoom = 0.75;

        this.squadron = [];
        this.missileSystem = new MissileSystem();
        this.lastDrawTime = 0;
        this.swayY = 0;

        this.init3DModel();
    }

    /**
     * Handle resize
     * @param {number} w
     * @param {number} h
     */
    resize(w, h) {
        super.resize(w, h);
        if (!this.initialized) {
            this.initParticles(w, h);
            this.initialized = true;
        }
    }

    /**
     * Initialize background particles（照搬仓库 renderer.js initParticles）

    /**
     * 3D -> 2D 投影（替代仓库的 THREE.Vector3 + 相机投影）。
     * 相机位于 (0, 0, 8/zoom) 看向原点，视场角 75 度，与仓库一致；
     * 旋转顺序与 Three.js 默认 Euler XYZ 一致（先 Z、再 Y、再 X）。
     * Y 轴向下为正：船体“上方”是 -Y，投影后在屏幕上方。
     * 返回的 z 为到相机的距离（depth），相机后方为负。
     */
    _makeTransformFn(w, h) {
        const f = (h / 2) / Math.tan(37.5 * Math.PI / 180); // 75 度视场角的焦距
        const camZ = 8 / this.zoom;
        const rx = this.rotation.x, ry = this.rotation.y, rz = this.rotation.z;
        const cx1 = Math.cos(rx), sx1 = Math.sin(rx);
        const cy1 = Math.cos(ry), sy1 = Math.sin(ry);
        const cz1 = Math.cos(rz), sz1 = Math.sin(rz);
        const swayY = this.swayY;
        const halfW = w / 2, halfH = h / 2;

        return (x, y, z) => {
            // Rz -> Ry -> Rx
            let x1 = x * cz1 - y * sz1, y1 = x * sz1 + y * cz1, z1 = z;
            let x2 = x1 * cy1 + z1 * sy1, z2 = -x1 * sy1 + z1 * cy1, y2 = y1;
            let x3 = x2, y3 = y2 * cx1 - z2 * sx1, z3 = y2 * sx1 + z2 * cx1;
            // 编队上下浮动（仓库 modelGroup.position.y）
            y3 += swayY;

            const depth = camZ - z3;
            if (depth <= 0.1) return { x: -9999, y: -9999, p: 0, visible: false, z: depth };
            const s = f / depth;
            const sx = halfW + x3 * s;
            const sy = halfH + y3 * s;
            const dist = Math.sqrt(x3 * x3 + y3 * y3 + depth * depth);
            return { x: sx, y: sy, p: 8.0 / Math.max(0.1, dist), visible: true, z: depth };
        };
    }

        if (this.lastDrawTime && (now - this.lastDrawTime > 500)) {

        }
        this.lastDrawTime = now;

        analyser.getByteFrequencyData(dataArray);
        const { ctx, width: w, height: h } = this;

        if (this.particles.length === 0) this.initParticles(w, h);

        let bass = 0;

        const cx = w / 2;
        const cy = h / 2;

        ctx.globalCompositeOperation = 'lighter';

        this.particles.forEach((p) => {
            const oldX = p.x;
            const oldY = p.y;

            let dx = p.x - cx;
            let dy = p.y - cy;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let angle = Math.atan2(dy, dx);

            const maxDist = Math.max(w, h) * 0.8;
            if (dist < 5 || dist > maxDist) {
                angle = Math.random() * Math.PI * 2;
                dist = 10 + Math.random() * 20;
                p.x = cx + Math.cos(angle) * dist;
                p.y = cy + Math.sin(angle) * dist;
                return;
            }

            angle += 0.01 * p.randomSpeed * (bass > 0.5 ? 2 : 1);
            dist += speedBase * p.randomSpeed * 5;

            p.x = cx + Math.cos(angle) * dist;
            p.y = cy + Math.sin(angle) * dist;

            const size = p.baseSize * (0.3 + bass * 0.7);
            const alpha = Math.min(1, (dist / (w / 3)));

            ctx.beginPath();
            ctx.moveTo(oldX, oldY);
            ctx.lineTo(p.x, p.y);
            ctx.lineWidth = size;
            ctx.strokeStyle = p.colorType === 'primary' ? theme.primary : theme.secondary;
            ctx.lineCap = 'round';
            ctx.globalAlpha = alpha;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(p.x, p.y, size * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = alpha;
            ctx.fill();

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1.0;

        // --- 3D 编队渲染（仓库 draw3DPlane 的逻辑，Three.js 部分换成软件光栅）---
        // Smooth Rotation（仓库原样）
        this.rotation.x += (this.targetRotation.x - this.rotation.x) * 0.1;
        this.rotation.y += (this.targetRotation.y - this.rotation.y) * 0.1;
        this.rotation.z += (this.targetRotation.z - this.rotation.z) * 0.1;

        const time = Date.now() / 1000;
        this.swayY = Math.sin(time) * 0.1 * 5;

        const transformFn = this._makeTransformFn(w, h);
        const dt = 0.016; // Approx 60fps（仓库原样）

        this.squadron.forEach(fighter => {
            // 1. Update Physics/Logic（仓库原样；尾焰/雷达在 update 里推进）
            fighter.update(dt, bass, isSpeaking);

            //    showRadar=true：雷达面板是 FIGHTER 模式的组成部分
            fighter.render(ctx, transformFn, bass, this.squadron, true);
        });

        // Update and Render Missiles（仓库原样）
        this.missileSystem.update(dt);
        this.missileSystem.render(ctx, transformFn);

        this.drawTime(theme);
    }

        class Visualizer {
            constructor(canvas, analyser) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.analyser = analyser;
                this.mode = 0; 
                this.modes = ['SPECTRUM', 'MIRROR', 'WAVEFORM', 'OSCILLOSCOPE', 'RADIAL', 'PARTICLES', 'SOLAR'];
                this.running = false;
                
                // 缓存主题颜色
                this.colorTheme = '#00f3ff';
                this.colorSecondary = '#ff00ff';
                this.updateThemeColors();

                // 新增模式渲染器（SOLAR / FIGHTER，移植自仓库）
                this.solarRenderer = new SolarSystemRenderer(this.ctx);
                // FIGHTER 已去掉：不再实例化 FighterRenderer（2026-11-10 实测太卡）
                // 呼号淡入淡出状态（与仓库 Visualizer 一致）
                this.callsignState = { text: '', opacity: 0, targetOpacity: 0 };
                this.currentCallsign = '';
                this._lastLaunchCallsign = '';
                // 指针位置（SOLAR 悬停提示用，画布像素坐标）
                this.inputState = { x: 0, y: 0, active: false };
                // FIGHTER 拖拽旋转后，抑制随后那次 click 触发的模式切换
                this.suppressModeSwitch = false;
                this._lastLoopTime = 0;
                this._bindPointer();

                this.resize();
                
                // 使用 ResizeObserver 监听容器大小变化，解决布局变动导致的变形问题
                this.resizeObserver = new ResizeObserver(() => this.resize());
                this.resizeObserver.observe(this.canvas);
            }

            updateThemeColors() {
                const styles = getComputedStyle(document.body);
                this.colorTheme = styles.getPropertyValue('--accent-cyan').trim() || '#00f3ff';
                this.colorSecondary = styles.getPropertyValue('--accent-magenta').trim() || '#ff00ff';
            }

            resize() {
                this.canvas.width = this.canvas.clientWidth * window.devicePixelRatio;
                this.canvas.height = this.canvas.clientHeight * window.devicePixelRatio;
                if (this.solarRenderer) this.solarRenderer.resize(this.canvas.width, this.canvas.height);
                if (this.fighterRenderer) this.fighterRenderer.resize(this.canvas.width, this.canvas.height);
            }

            setAnalyser(analyser) { this.analyser = analyser; }

            // 指针跟踪：SOLAR 悬停提示 + FIGHTER 拖拽旋转（触摸/鼠标共用）
            _bindPointer() {
                const toCanvas = (pt) => {
                    const rect = this.canvas.getBoundingClientRect();
                    return {
                        x: (pt.clientX - rect.left) * window.devicePixelRatio,
                        y: (pt.clientY - rect.top) * window.devicePixelRatio
                    };
                };
                let dragStart = null;
                let dragged = false;
                const isFighter = () => this.modes[this.mode] === 'FIGHTER';
                const dragThreshold = () => 12 * window.devicePixelRatio;

                this.canvas.addEventListener('touchstart', (e) => {
                    const p = toCanvas(e.touches[0]);
                    this.inputState.x = p.x; this.inputState.y = p.y; this.inputState.active = true;
                    dragStart = p; dragged = false;
                    if (isFighter()) this.fighterRenderer.onDragStart(p.x, p.y);
                }, { passive: true });
                this.canvas.addEventListener('touchmove', (e) => {
                    const p = toCanvas(e.touches[0]);
                    this.inputState.x = p.x; this.inputState.y = p.y;
                    if (dragStart) {
                        if (Math.abs(p.x - dragStart.x) + Math.abs(p.y - dragStart.y) > dragThreshold()) dragged = true;
                        if (dragged && isFighter()) this.fighterRenderer.onDragMove(p.x, p.y);
                    }
                }, { passive: true });
                const endTouch = () => {
                    this.inputState.active = false;
                    if (dragged) this.suppressModeSwitch = true;
                    dragStart = null; dragged = false;
                    if (isFighter()) this.fighterRenderer.onDragEnd();
                };
                this.canvas.addEventListener('touchend', endTouch);
                this.canvas.addEventListener('touchcancel', endTouch);

                this.canvas.addEventListener('mousedown', (e) => {
                    const p = toCanvas(e);
                    this.inputState.x = p.x; this.inputState.y = p.y; this.inputState.active = true;
                    dragStart = p; dragged = false;
                    if (isFighter()) this.fighterRenderer.onDragStart(p.x, p.y);
                });
                this.canvas.addEventListener('mousemove', (e) => {
                    const p = toCanvas(e);
                    this.inputState.x = p.x; this.inputState.y = p.y;
                    if (dragStart) {
                        if (Math.abs(p.x - dragStart.x) + Math.abs(p.y - dragStart.y) > dragThreshold()) dragged = true;
                        if (dragged && isFighter()) this.fighterRenderer.onDragMove(p.x, p.y);
