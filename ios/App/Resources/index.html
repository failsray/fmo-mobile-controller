                        if (bass > 0.5 && i > 0) {
                            const prevAngle = ((i-1)/count) * Math.PI * 2;
                            const prevX = cx + Math.cos(prevAngle + time) * r;
                            const prevY = cy + Math.sin(prevAngle + time) * r;
                            
                            this.ctx.beginPath();
                            this.ctx.moveTo(x, y);
                            this.ctx.lineTo(prevX, prevY);
                            this.ctx.strokeStyle = colorTheme;
                            this.ctx.lineWidth = 1;
                            this.ctx.globalAlpha = 0.5;
                            this.ctx.stroke();
                            this.ctx.globalAlpha = 1.0;
                        }
                    }
                }
                
                else if (modeName === 'SOLAR') {
                    this.solarRenderer.draw(effectiveAnalyser, dataArray, bufferLength,
                        { primary: colorTheme, secondary: colorSecondary },
                        { callsign: this.callsignState.text, opacity: this.callsignState.opacity, input: this.inputState, repeaterStations: (this.lastRepeaterStations || []) });
                }
                
                // Reset shadow for next frame performance
                this.ctx.shadowBlur = 0;
            }
        }

        /** 应用设置管理器 */
        class SettingsManager {
            constructor() {
                this.storageKey = 'fmo_app_settings';
                this.settings = {
                    // 设备相关
                    lastConnectedIp: '',
                    deviceHistory: [],
                    
                    // 主题相关
                    currentTheme: '',
                    
            // 音频相关
            volume: 1.0,
            isMuted: false,
                    
                    // 可视化相关
                    vizMode: 0, // 0: SPECTRUM, 1: MIRROR, 2: WAVEFORM, 3: OSCILLOSCOPE, 4: RADIAL, 5: PARTICLES, 6: SOLAR（FIGHTER已去掉）
                    
                    // 其他设置
                    autoConnect: true
                };
                this.load();
            }

            load() {
                try {
                    const saved = localStorage.getItem(this.storageKey);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        this.settings = { ...this.settings, ...parsed };
                    }
                } catch (e) {
                    // 加载设置失败
                }
            }

            save() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.settings));
                } catch (e) {
                    // 保存设置失败
                }
            }

            // 设备历史管理
            addDevice(ip) {
                if (!ip) return;
                // 移除已存在的（为了置顶）
                this.settings.deviceHistory = this.settings.deviceHistory.filter(d => d !== ip);
                // 添加到头部
                this.settings.deviceHistory.unshift(ip);
                // 限制数量
                if (this.settings.deviceHistory.length > 5) this.settings.deviceHistory.pop();
                this.settings.lastConnectedIp = ip;
                this.save();
            }

            removeDevice(ip) {
                this.settings.deviceHistory = this.settings.deviceHistory.filter(d => d !== ip);
                if (this.settings.lastConnectedIp === ip) {
                    this.settings.lastConnectedIp = this.settings.deviceHistory[0] || '';
                }
                this.save();
            }

            getLastIp() {
                return this.settings.lastConnectedIp;
            }

            getDeviceHistory() {
                return [...this.settings.deviceHistory];
            }

            // 主题设置
            setTheme(themeName) {
                this.settings.currentTheme = themeName;
                this.save();
            }

            getTheme() {
                return this.settings.currentTheme;
            }

            // 音量设置
            setVolume(volume) {
                this.settings.volume = volume;
                this.settings.isMuted = volume === 0;
                this.save();
            }

            getVolume() {
                return this.settings.volume;
            }

            // 可视化模式
            setVizMode(modeIndex) {
                this.settings.vizMode = modeIndex;
                this.save();
            }

            getVizMode() {
                return this.settings.vizMode;
            }

            // 自动连接
            setAutoConnect(enabled) {
                this.settings.autoConnect = enabled;
                this.save();
            }

            getAutoConnect() {
                return this.settings.autoConnect;
            }

            // 渲染设备历史
            renderDeviceHistory() {
                const container = document.getElementById('device-history');
                if (!container) return;
                container.innerHTML = '';
                
                const currentIp = document.getElementById('inp-host').value;

                this.settings.deviceHistory.forEach(ip => {
                    const tag = document.createElement('div');
                    tag.className = 'device-tag';
                    if (currentIp === ip) tag.classList.add('active');
                    
                    tag.innerHTML = `
                        ${ip}
                        <span class="device-del" title="删除">✕</span>
                    `;
                    
                    tag.onclick = () => {
                        document.getElementById('inp-host').value = ip;
                        this.renderDeviceHistory(); // 更新高亮
                        // 触发连接
                        document.getElementById('btn-connect').click();
                    };
                    
                    const delBtn = tag.querySelector('.device-del');
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        this.removeDevice(ip);
                        this.renderDeviceHistory();
                    };
                    
                    container.appendChild(tag);
                });
            }
        }

        /** QSO 日志管理器 */
        class QsoManager {
            constructor(client) {
                this.client = client;
                this.modal = document.getElementById('qso-modal');
                this.listEl = document.getElementById('qso-list');
                this.btn = document.getElementById('btn-qso');
                this.btnClose = document.getElementById('btn-qso-close');
                this.countEl = document.getElementById('qso-count-value');
                
                this.page = 0;
                this.pageSize = 20; // Default page size
                this.isLoading = false;

                if (this.btn && this.modal) {
                    this.initEvents();
                }
            }

            initEvents() {
                // Open Modal
                this.btn.addEventListener('click', () => {
                    this.show();
                });

                // Close Modal
                this.btnClose.addEventListener('click', () => {
                    this.hide();
                });
                
                // Close on backdrop click
                this.modal.addEventListener('click', (e) => {
                    if (e.target === this.modal) this.hide();
                });

                // Handle WS messages
                this.client.on('qsoMessage', (msg) => {
                    if (msg.subType === 'getListResponse') {
                        // 更新数量统计
                        if (msg.data.total !== undefined) {
                            this.updateCount(msg.data.total);
                        } else if (msg.data.list) {
                            this.updateCount(msg.data.list.length);
                        }
                        this.renderList(msg.data.list || []);
                    }
                });

                // 连接成功后自动获取一次数据以更新计数
                this.client.on('status', (connected) => {
                    if (connected) {
                        this.fetchData();
                    }
                });
            }

            updateCount(count) {
                if (this.countEl) {
                    this.countEl.textContent = count;
                }
                if (this.btn) {
                    this.btn.title = `QSO 日志 (已通联: ${count})`;
                }
            }

            show() {
                this.modal.classList.add('show');
                this.fetchData();
            }

            hide() {
                this.modal.classList.remove('show');
            }

            fetchData() {
                this.listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">Loading...</div>';
                this.client.getQsoList(this.page, this.pageSize);
            }

            formatDate(ts) {
                if (!ts) return '-';
                const d = new Date(ts * 1000);
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            renderList(list) {
                if (!list || list.length === 0) {
                    this.listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No QSO logs found.</div>';
                    return;
                }

                this.listEl.innerHTML = list.map(item => {
                    const call = item.toCallsign || 'UNKNOWN';
                    const grid = item.grid || '-';
                    const time = this.formatDate(item.timestamp);
                    // item.freqHz unit is uncertain, assuming Hz and converting to MHz
                    const freq = item.freqHz ? (item.freqHz / 1000000).toFixed(4) + ' MHz' : ''; 
                    
                    return `
                    <div class="qso-item">
                        <div class="qso-info">
                            <div class="qso-call">
                                ${call}
                                <span class="qso-mode">${grid}</span>
                            </div>
                            <div class="qso-meta">
                                ${freq ? `<span class="qso-freq">${freq}</span>` : ''}
                                <span class="qso-time">${time}</span>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            }
        }

        /** 录音文件管理器 */
        class RecordingsManager {
            constructor() {

                this.listEl = document.getElementById('recordings-list');
                this.btnClose = document.getElementById('btn-recordings-close');
                this.btnRefresh = document.getElementById('btn-refresh-recordings');
                this.countEl = document.getElementById('recordings-count');
                
                this.recordings = [];
                this.currentlyPlaying = null;
                this.audioContext = null;
                this.audioBuffer = null;
                this.audioSource = null;
                
                if (this.modal) {
                    this.initEvents();
                }
            }

            initEvents() {
                // Close Modal
                this.btnClose.addEventListener('click', () => {
                    this.hide();
                });
                
                // Close on backdrop click
                this.modal.addEventListener('click', (e) => {
                    if (e.target === this.modal) this.hide();
                });

                // Refresh button
                this.btnRefresh.addEventListener('click', () => {
                    this.loadRecordings();
                });
            }

            show() {
                this.modal.classList.add('show');
                this.loadRecordings();
            }

            hide() {
                this.modal.classList.remove('show');
                this.stopPlayback();
            }

            async loadRecordings() {
                if (typeof Android === 'undefined' || !Android.getRecordingsList) {
                    this.showError('Android接口不可用');
                    return;
                }

                this.listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">加载录音文件中...</div>';
                
                try {
                    const jsonStr = Android.getRecordingsList();
                    const recordings = JSON.parse(jsonStr);
                    this.recordings = recordings;
                    this.renderList();
                } catch (error) {
                    console.error('加载录音文件失败:', error);
                    this.showError('加载录音文件失败: ' + error.message);
                }
            }

            showError(message) {
                this.listEl.innerHTML = `
                    <div style="padding: 40px 20px; text-align: center; color: #ff3333;">
                        <div style="margin-bottom: 15px;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                        </div>
                        ${message}
                    </div>
                `;
                this.countEl.textContent = '0';
            }


            renderList() {
                if (!this.recordings || this.recordings.length === 0) {
                    this.listEl.innerHTML = `
                        <div style="padding: 40px 20px; text-align: center; color: #666;">
                            <div style="margin-bottom: 15px;">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" style="color: var(--text-muted); opacity: 0.5;">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>
                            </div>
                            暂无录音文件
                        </div>
                    `;
                    this.countEl.textContent = '0';
                    return;
                }

                this.countEl.textContent = this.recordings.length.toString();
                
                this.listEl.innerHTML = this.recordings.map((rec, index) => {
                    const isPlaying = this.currentlyPlaying === rec.name;
                    const fileName = rec.name;
                    const fileDate = rec.date || new Date(rec.lastModified).toLocaleString();
                    
                    return `
                    <div class="qso-item" data-index="${index}">
                        <div class="qso-info">
                            <div class="qso-call" style="font-size: 0.9rem;">
                                ${fileName}
                            </div>
                            <div class="qso-meta">
                                <span class="qso-time" style="font-size: 0.75rem;">${fileDate}</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <button class="btn-tiny btn-play-recording" data-name="${fileName}" style="background: ${isPlaying ? 'rgba(255, 152, 0, 0.3)' : 'rgba(255, 152, 0, 0.2)'}; color: var(--accent-cyan); padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; font-weight: bold; border: none;">
                                ${isPlaying ? '⏹️' : '▶️'}
                            </button>
                            <button class="btn-tiny btn-delete-recording" data-name="${fileName}" style="background: rgba(255, 0, 0, 0.2); color: #ff3333; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; font-weight: bold; border: none;">
                                🗑️
                            </button>
                        </div>
                    </div>
                    `;
                }).join('');

                // 添加事件监听器
                this.listEl.querySelectorAll('.btn-play-recording').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const fileName = btn.getAttribute('data-name');
                        this.togglePlayback(fileName);
                    });
                });

                // 添加删除按钮事件监听器
                this.listEl.querySelectorAll('.btn-delete-recording').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const fileName = btn.getAttribute('data-name');
                        this.deleteRecording(fileName);
                    });
                });

                // 点击项目也可以播放
                this.listEl.querySelectorAll('.qso-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (!e.target.closest('button')) {
                            const index = item.getAttribute('data-index');
                            const fileName = this.recordings[index].name;
                            this.togglePlayback(fileName);
                        }
                    });
                });
            }

            async togglePlayback(fileName) {
                if (this.currentlyPlaying === fileName) {
                    this.stopPlayback();
                    return;
                }

                // 停止当前播放
                this.stopPlayback();

                // 开始播放新文件
                try {
                    if (typeof Android === 'undefined' || !Android.getRecordingBase64) {
                        throw new Error('Android接口不可用');
                    }

                    const base64Data = Android.getRecordingBase64(fileName);
                    if (!base64Data) {
                        throw new Error('获取录音数据失败');
                    }

                    // 创建音频上下文
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    // 解码base64数据
                    const audioData = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
                    const audioBuffer = await this.audioContext.decodeAudioData(audioData.buffer);
                    
                    // 创建音频源
                    this.audioSource = this.audioContext.createBufferSource();
                    this.audioSource.buffer = audioBuffer;
                    this.audioSource.connect(this.audioContext.destination);
                    
                    // 设置播放结束回调
                    this.audioSource.onended = () => {
                        this.currentlyPlaying = null;
                        this.renderList();
                    };
                    
                    // 开始播放
                    this.audioSource.start();
                    this.currentlyPlaying = fileName;
                    this.renderList();

                } catch (error) {
                    console.error('播放录音失败:', error);
                    if (typeof Android !== 'undefined' && Android.showToast) {
                        Android.showToast('播放失败: ' + error.message);
                    }
                }
            }

            stopPlayback() {
                if (this.audioSource) {
                    try {
                        this.audioSource.stop();
                    } catch (e) {
                        // 忽略已经停止的源
                    }
                    this.audioSource = null;
                }
                this.currentlyPlaying = null;
                this.renderList();
            }


            async deleteRecording(fileName) {
                // 使用自定义确认对话框
                return new Promise((resolve) => {
                    const confirmDialog = document.getElementById('confirm-dialog');
                    const confirmMessage = document.getElementById('confirm-message');
                    const btnConfirmCancel = document.getElementById('btn-confirm-cancel');
                    const btnConfirmOk = document.getElementById('btn-confirm-ok');
                    const btnConfirmClose = document.getElementById('btn-confirm-close');
                    
                    // 设置确认消息
                    confirmMessage.textContent = `确定要删除录音文件 "${fileName}" 吗？`;
                    
                    // 显示对话框
                    confirmDialog.classList.add('show');
                    
                    // 定义清理函数
                    const cleanup = () => {
                        confirmDialog.classList.remove('show');
                        btnConfirmCancel.removeEventListener('click', onCancel);
                        btnConfirmOk.removeEventListener('click', onOk);
                        btnConfirmClose.removeEventListener('click', onCancel);
                        confirmDialog.removeEventListener('click', onBackdropClick);
                    };
                    
                    // 取消处理
                    const onCancel = () => {
                        cleanup();
                        resolve(false);
                    };
                    
                    // 确定处理
                    const onOk = async () => {
                        cleanup();
                        
                        try {
                            // 如果正在播放该文件，先停止播放
                            if (this.currentlyPlaying === fileName) {
                                this.stopPlayback();
                            }

                            // 调用Android接口删除录音文件
                            if (typeof Android !== 'undefined' && Android.deleteRecording) {
                                const success = Android.deleteRecording(fileName);
                                if (success) {
                                    // 从列表中移除
                                    this.recordings = this.recordings.filter(rec => rec.name !== fileName);
                                    this.renderList();
                                    
                                    // 显示提示
                                    if (typeof Android !== 'undefined' && Android.showToast) {
                                        Android.showToast('录音文件已删除');
                                    }
                                } else {
                                    throw new Error('删除失败');
                                }
                            } else {
                                throw new Error('Android接口不可用');
                            }
                        } catch (error) {
                            console.error('删除录音失败:', error);
                            if (typeof Android !== 'undefined' && Android.showToast) {
                                Android.showToast('删除失败: ' + error.message);
                            }
                        }
                        
                        resolve(true);
                    };
                    
                    // 点击背景关闭
                    const onBackdropClick = (e) => {
                        if (e.target === confirmDialog) {
                            onCancel();
                        }
                    };
                    
                    // 绑定事件
                    btnConfirmCancel.addEventListener('click', onCancel);
                    btnConfirmOk.addEventListener('click', onOk);
                    btnConfirmClose.addEventListener('click', onCancel);
                    confirmDialog.addEventListener('click', onBackdropClick);
                });
            }
        }

        /** 事件订阅客户端 (EventsService) */
        class EventsClient {
            constructor() {
                this.ws = null;
                this.host = '';
                this.connected = false;
                this.reconnectTimer = null;
                this.retryMs = 1000;
                this.listeners = new Set();
                this.subtitleEl = document.getElementById('subtitle-overlay');
                this.subtitleText = document.getElementById('subtitle-text');
                this.speakingTimeout = null;
            }

            connect(host) {
                this.host = host;
                if (this.ws) return;

                try {
                    this.ws = new WebSocket(`ws://${host}/events`);
                    
                    this.ws.onopen = () => {
                        this.connected = true;
                        this.retryMs = 1000;
                        console.log('Events connected');
                    };

                    this.ws.onmessage = (e) => {
                        try {
                            const msg = JSON.parse(e.data);
                            this.handleMessage(msg);
                        } catch (err) {
                            console.error('Events parse error:', err);
                        }
                    };

                    this.ws.onclose = () => {
                        this.connected = false;
                        this.ws = null;
                        this.scheduleReconnect();
                    };

                    this.ws.onerror = () => {
                        this.ws = null; // Let onclose handle it
                    };

                } catch (e) {
                    console.error('Events connect failed:', e);
                    this.scheduleReconnect();
                }
            }

            disconnect() {
                if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
                if (this.ws) {
                    this.ws.onclose = null; // Prevent reconnect
                    this.ws.close();
                    this.ws = null;
                }
                this.connected = false;
            }

            scheduleReconnect() {
                if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
                this.reconnectTimer = setTimeout(() => {
                    this.retryMs = 1000; // 保持 1秒 重试，不增加时间
                    this.connect(this.host);
                }, this.retryMs);
            }

            handleMessage(msg) {
                // 处理 QSO 发言人事件
                if (msg.type === 'qso' && msg.subType === 'callsign' && msg.data) {
                    const { callsign, isSpeaking } = msg.data;
                    this.updateSubtitle(callsign, isSpeaking);
                }
            }

            updateSubtitle(callsign, isSpeaking) {
                // 可视化联动：SOLAR 目标标注 / FIGHTER 导弹发射 / UFO 彩蛋
                if (window.__fmoViz) window.__fmoViz.setLiveCallsign(callsign, isSpeaking);
                if (!this.subtitleEl || !this.subtitleText) return;

                if (isSpeaking) {
                    this.subtitleText.textContent = callsign;
                    this.subtitleEl.style.display = 'flex';
                    
                    // 去除自动隐藏的时间判断，只要 isSpeaking 为 true 就一直显示
                    if (this.speakingTimeout) clearTimeout(this.speakingTimeout);
                } else {
                    // 停止发言时立即隐藏
                    this.subtitleEl.style.display = 'none';
                    if (this.speakingTimeout) clearTimeout(this.speakingTimeout);
                }
            }
        }

        // --- 应用逻辑 ---
        const ctrl = new ControlClient();
        const player = new AudioPlayer();
        const viz = new Visualizer(document.getElementById('viz-canvas'), null);
        window.__fmoViz = viz; // 供 EventsClient.updateSubtitle 联动可视化（呼号/导弹/UFO）
        const settingsMgr = new SettingsManager();
        const qsoMgr = new QsoManager(ctrl); // Add QSO Manager
        const recordingsMgr = new RecordingsManager(); // Add Recordings Manager
        const events = new EventsClient();
        
        // 初始化UI
        document.getElementById('inp-host').value = settingsMgr.getLastIp() || window.location.hostname || 'fmo.local';
        
        const ui = {
            ledWs: document.getElementById('led-ws'),
            ledAudio: document.getElementById('led-audio'),
            btnTheme: document.getElementById('btn-theme'),
            btnSettingsToggle: document.getElementById('btn-settings-toggle'),
            settingsArea: document.getElementById('settings-area'),
            btnPlay: document.getElementById('btn-play'),
            // volKnob/volValue removed (using VolumeSlider)
            btnRecord: document.getElementById('btn-record'),
            vizArea: document.getElementById('viz-area'),
            vizModeText: document.getElementById('viz-mode-text'),
            currentStationText: document.getElementById('current-station-text'),
            stCount: document.getElementById('st-count'),
            stList: document.getElementById('st-list'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            inpHost: document.getElementById('inp-host'),
            btnConnect: document.getElementById('btn-connect'),
        };

        let currentStationId = null;
        
        // 主题定义
        const themes = ['', 'theme-matrix', 'theme-ocean', 'theme-sunset', 'theme-light'];
        let currentThemeIndex = 0;
        
        // 初始化设置恢复
        function restoreSettings() {
            // 1. 恢复主题
            const savedTheme = settingsMgr.getTheme();
            if (savedTheme) {
                const themeIndex = themes.indexOf(savedTheme);
                if (themeIndex !== -1) {
                    currentThemeIndex = themeIndex;
                    if (themes[currentThemeIndex]) {
                        document.body.classList.add(themes[currentThemeIndex]);
                    }
                }
            }
            
            // 2. 恢复音量
            const savedVolume = settingsMgr.getVolume();
            if (savedVolume !== undefined) {
                // 音量条会在VolumeSlider初始化后设置
                setTimeout(() => {
                    if (window.volSlider) {
                        window.volSlider.setVolume(savedVolume);
                    }
                }, 100);
            }
            
            // 3. 恢复可视化模式
            const savedVizMode = settingsMgr.getVizMode();
            if (savedVizMode !== undefined && savedVizMode >= 0 && savedVizMode < viz.modes.length) {
                viz.mode = savedVizMode;
                ui.vizModeText.textContent = viz.modes[viz.mode];
                if (viz.updateSolarModeClass) viz.updateSolarModeClass();
            }
            
            // 4. 渲染设备历史
            settingsMgr.renderDeviceHistory();
            
            // 5. 自动连接（如果启用）
            if (settingsMgr.getAutoConnect() && settingsMgr.getLastIp()) {
                setTimeout(() => {
                    const lastIp = settingsMgr.getLastIp();
                    if (lastIp && lastIp.trim()) {
                        ui.inpHost.value = lastIp;
                        // 延迟自动连接，让UI有时间初始化
                        setTimeout(() => {
                            ui.btnConnect.click();
                        }, 500);
                    }
                }, 1000);
            }
        }
        
        // 0. 主题切换（增强版，保存设置）
        ui.btnTheme.addEventListener('click', () => {
            if (themes[currentThemeIndex]) {
                document.body.classList.remove(themes[currentThemeIndex]);
            }
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            if (themes[currentThemeIndex]) {
                document.body.classList.add(themes[currentThemeIndex]);
            }
            // 保存主题设置
            settingsMgr.setTheme(themes[currentThemeIndex]);
            // Update visualizer colors
            viz.updateThemeColors();
        });

        // 0.1 设置开关
        ui.btnSettingsToggle.addEventListener('click', () => {
            ui.settingsArea.classList.toggle('open');
        });

        // 1. 连接逻辑
        ui.btnConnect.addEventListener('click', () => {
            const host = ui.inpHost.value.trim();
            if (!host) return;
            ctrl.connect(host);
            player.connect(host);
            events.connect(host);
            viz.start();
            settingsMgr.addDevice(host);
            settingsMgr.renderDeviceHistory();
        });

        ctrl.on('status', (connected) => {
            ui.ledWs.className = `status-dot ${connected ? 'connected' : 'error'}`;
            if (connected) {
                ui.btnConnect.textContent = '已连接';
                ui.btnConnect.style.color = 'var(--accent-green)';
            } else {
                ui.btnConnect.textContent = 'CONNECT';
                ui.btnConnect.style.color = 'var(--accent-cyan)';
            }
        });

        player.on('status', (connected) => {
            ui.ledAudio.className = `status-dot ${connected ? 'connected' : 'error'}`;
            // 音频连接后，将分析节点交给可视化引擎
            if (connected && player.analyser) {
                viz.setAnalyser(player.analyser);
                viz.start();
            }
        });

        // 2. 播放控制
        ui.btnPlay.addEventListener('click', () => {
            const host = ui.inpHost.value.trim();
            if (!player.connected) {
                player.connect(host);
            } else {
                // 仅作为重连或断开开关
                player.disconnect();
            }
        });
        
        // 监听音频连接状态改变按钮样式
        player.on('status', (connected) => {
            if (connected) {
                ui.btnPlay.classList.add('active');
                ui.btnPlay.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
            } else {
                ui.btnPlay.classList.remove('active');
                ui.btnPlay.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
            }
        });

        // 音量条初始化
        const volContainer = document.getElementById('vol-container');
        const volSlider = new VolumeSlider(volContainer, player);

        // 3. 可视化切换（增强版，保存设置）
        ui.vizArea.addEventListener('click', () => {
            // FIGHTER 模式下刚拖拽旋转过，不切换模式
            if (viz.suppressModeSwitch) { viz.suppressModeSwitch = false; return; }
            const modeName = viz.switchMode();
            ui.vizModeText.textContent = modeName;
            // 保存可视化模式设置
            settingsMgr.setVizMode(viz.mode);
        });

        // 5. 录音控制
        ui.btnRecord.addEventListener('click', async () => {
            if (!player.recording) {
                // 开始录音
                if (!player.connected) {
                    // 使用Android.showToast显示提示
                    if (typeof Android !== 'undefined' && Android.showToast) {
                        Android.showToast('请先连接音频！');
                    } else {
                        alert('请先连接音频！');
                    }
                    return;
                }
                player.startRecording();
                ui.btnRecord.classList.add('recording');
            } else {
                // 停止录音并保存到Android download文件夹
                ui.btnRecord.classList.remove('recording');
                
                try {
                    // 获取base64录音数据
                    const base64Data = await player.getRecordingAsBase64();
                    if (!base64Data) {
                        // 使用Android.showToast显示提示
                        if (typeof Android !== 'undefined' && Android.showToast) {
                            Android.showToast('录音时长太短或无数据');
                        } else {
                            alert('录音时长太短或无数据');
                        }
                        // 即使没有数据，也要确保录音状态被重置
                        // getRecordingAsBase64() 已经重置了状态，但为了安全起见，再次确认
                        player.recording = false;
                        player.recordedChunks = [];
                        return;
                    }
                    
                    // 生成文件名：FMO_年-月-日_编号
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    
                    // 获取当天已有的录音文件列表，确定下一个编号
                    let fileName = '';
                    if (typeof Android !== 'undefined' && Android.getRecordingsList) {
                        try {
                            const jsonStr = Android.getRecordingsList();
                            const recordings = JSON.parse(jsonStr);
                            
                            // 过滤出当天的录音文件
                            const todayPrefix = `FMO_${year}-${month}-${day}`;
                            const todayRecordings = recordings.filter(rec => 
                                rec.name && rec.name.startsWith(todayPrefix)
                            );
                            
                            if (todayRecordings.length === 0) {
                                // 当天第一个录音
                                fileName = `${todayPrefix}_1.wav`;
                            } else {
                                // 找出最大的编号
                                let maxNumber = 0;
                                todayRecordings.forEach(rec => {
                                    const match = rec.name.match(new RegExp(`${todayPrefix}_(\\d+)\\.wav`));
                                    if (match) {
                                        const num = parseInt(match[1], 10);
                                        if (num > maxNumber) maxNumber = num;
                                    }
                                });
                                
                                // 使用下一个编号
                                fileName = `${todayPrefix}_${maxNumber + 1}.wav`;
                            }
                        } catch (error) {
                            console.error('获取录音列表失败，使用默认文件名:', error);
                            // 如果获取失败，使用默认文件名
                            fileName = `FMO_${year}-${month}-${day}_1.wav`;
                        }
                    } else {
                        // Android接口不可用，使用默认文件名
                        fileName = `FMO_${year}-${month}-${day}_1.wav`;
                    }
                    
                    // 调用Android接口保存录音
                    if (typeof Android !== 'undefined' && Android.saveRecording) {
                        Android.saveRecording(base64Data, fileName);
                        // 使用Android.showToast显示提示
                        if (Android.showToast) {
                            Android.showToast('录音已保存到Download文件夹');
                        }
                    } else {
                        // 备用方案：如果Android接口不可用，使用原来的下载方式
                        const blob = player.stopRecording();
                        if (blob) {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = url;
                            a.download = fileName;
                            document.body.appendChild(a);
                            a.click();
                            setTimeout(() => {
                                document.body.removeChild(a);
                                window.URL.revokeObjectURL(url);
                            }, 100);
                        }
                    }
                } catch (error) {
                    console.error('录音保存失败:', error);
                    alert('录音保存失败: ' + error.message);
                }
            }
        });

        // 6. 录音按钮长按事件 - 显示录音记录
        let longPressTimer = null;
        const LONG_PRESS_DURATION = 1000; // 1秒
        
        ui.btnRecord.addEventListener('touchstart', (e) => {
            longPressTimer = setTimeout(() => {
                // 长按触发，显示录音记录
                recordingsMgr.show();
                // 清除定时器
                longPressTimer = null;
                // 阻止默认行为
                e.preventDefault();
            }, LONG_PRESS_DURATION);
        });
        
        ui.btnRecord.addEventListener('touchend', (e) => {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        });
        
        ui.btnRecord.addEventListener('touchcancel', (e) => {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        });
        
        // 鼠标事件支持（桌面端）
        ui.btnRecord.addEventListener('mousedown', (e) => {
            longPressTimer = setTimeout(() => {
                // 长按触发，显示录音记录
                recordingsMgr.show();
                // 清除定时器
                longPressTimer = null;
                // 阻止默认行为
                e.preventDefault();
            }, LONG_PRESS_DURATION);
        });
        
        ui.btnRecord.addEventListener('mouseup', (e) => {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        });
        
        ui.btnRecord.addEventListener('mouseleave', (e) => {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        });

        // 4. 台站列表逻辑
        ctrl.on('stationList', (list) => {
            ui.stCount.textContent = `${list.length} STATIONS`;
            // 修复（2026-11-10）：SolarSystemRenderer 没有 updateRepeaterStations 方法
            // （只有 starField 有），旧代码在这里抛错，导致后面的列表渲染全被拦住——
            // 台站数在变、列表一直是“等待连接…”。改调 starField 的方法并 try/catch
            // 兜底，列表渲染再也不会被 SOLAR 同步拦住。
            viz.lastRepeaterStations = list;
            try {
                if (viz.solarRenderer && viz.solarRenderer.starField) viz.solarRenderer.starField.updateRepeaterStations(list);
            } catch (e) { console.error('SOLAR repeater sync failed:', e); }
            ui.stList.innerHTML = '';
            
            if (list.length === 0) {
                ui.stList.innerHTML = '<div class="station-item" style="grid-column: 1 / -1; justify-content: center; align-items: center; color: #666;">暂无台站</div>';
                return;
            }

            list.forEach(st => {
                const el = document.createElement('div');
                el.className = 'station-item';
                el.dataset.uid = st.uid;
                if (st.uid == currentStationId) el.classList.add('active');
                
                el.innerHTML = `
                    <div class="st-name">${st.name || 'Station ' + st.uid}</div>
                `;
                el.onclick = () => {
                    ctrl.setStation(st.uid);
                    // 乐观更新 UI
                    document.querySelectorAll('.station-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    currentStationId = st.uid;
                    
                    // Update viz text immediately
                    if (ui.currentStationText) {
                        ui.currentStationText.textContent = st.name || 'Station ' + st.uid;
                        ui.currentStationText.style.display = 'block';
                    }
                };
                ui.stList.appendChild(el);
            });


        });

        ctrl.on('stationCurrent', (data) => {
            currentStationId = data.uid;
            
            // Update current station text in viz area
            if (ui.currentStationText) {
                if (data && data.name) {
                    ui.currentStationText.textContent = data.name;
                    ui.currentStationText.style.display = 'block';
                } else {
                    ui.currentStationText.style.display = 'none';
                }
            }

            // 高亮当前
            const items = document.querySelectorAll('.station-item');
            items.forEach(el => {
                if (el.dataset.uid == currentStationId) el.classList.add('active');
                else el.classList.remove('active');
            });
        });

        ui.btnPrev.addEventListener('click', () => ctrl.prevStation());
        ui.btnNext.addEventListener('click', () => ctrl.nextStation());

        // 呼号显示逻辑已移除

        // 彩蛋：点击状态灯区域10次触发致谢
        let eggClickCount = 0;
        let eggTimer = null;
        const statusIndicators = document.querySelector('.status-indicators');
        if (statusIndicators) {
            statusIndicators.addEventListener('click', () => {
                eggClickCount++;
                if (eggTimer) clearTimeout(eggTimer);
                eggTimer = setTimeout(() => { eggClickCount = 0; }, 2000);
                
                if (eggClickCount >= 10) {
                    const creditsModal = document.getElementById('credits-modal');
                    if (creditsModal) creditsModal.classList.add('show');
                    eggClickCount = 0;
                }
            });
        }
        
        // 任何点击都尝试解锁音频上下文
        document.body.addEventListener('click', () => {
            if (player && player.unlock) {
                player.unlock();
            }
        }, { once: false });
        
        // 初始化 Credits Close 按钮
        const btnCreditsClose = document.getElementById('btn-credits-close');
        if (btnCreditsClose) {
            btnCreditsClose.addEventListener('click', () => {
                const creditsModal = document.getElementById('credits-modal');
                if (creditsModal) creditsModal.classList.remove('show');
            });
        }

        // 初始化完成后恢复设置
        window.volSlider = volSlider;
        window.settingsMgr = settingsMgr;
        restoreSettings();

    </script>


</body>
</html>
